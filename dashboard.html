/* Registros históricos 2015-2024 extraídos da planilha "Histórico de Exportação" — 1569 embarques */
const HIST_RECS = []; /* migrado para Supabase */
/* Nota: os totais anuais são calculados dinamicamente em cada componente
   a partir de recs (que inclui HIST_RECS + dados ao vivo do Supabase).
   Não há constante HIST pré-calculada — isso evita duplicação. */

/* ══════════════════════════════════════════
   NORMALIZAÇÃO DE DADOS
   Unifica variações de nome para análise
══════════════════════════════════════════ */
const NORM_CLIENTE = {
  "EASTCOAST":"ECMD","EAST COAST":"ECMD","EASTCOAST - SC":"ECMD","EASTCOAST - TX":"ECMD","ECMD NC":"ECMD",
  "BLUELINX TAMPA":"BLUELINX","BLUELINX CORP":"BLUELINX","BLUELINX CORP.":"BLUELINX","BLUELINX JACKSONVILLE":"BLUELINX",
  "BLUELINX ATLANTA":"BLUELINX","BLUELINX IMPORTS":"BLUELINX","BLUELINX S.A.":"BLUELINX","BLUELINX JAX":"BLUELINX",
  "BLUELINX SAN ANT.":"BLUELINX","BLUELINX GULFPORT":"BLUELINX","BLUENLINX JAX":"BLUELINX",
  "METRIE - BALTIMORE":"METRIE","METRIE -BALTIMORE":"METRIE","METRIE BALTIMORE":"METRIE",
  "METRIE - ATLANTA":"METRIE","METRIE -ATLANTA":"METRIE","METRIE ATLANTA":"METRIE",
  "METRIE - DALLAS":"METRIE","METRIE DALLAS":"METRIE","METRIE INC":"METRIE",
  "EMPIRE VIRGINIA":"EMPIRE",
  "SHAMROCK INT'L":"SHAMROCK",
  "W00DGRAIN":"WOODGRAIN",
};

const NORM_DESTINO = {
  "PHILADELHIA":"PHILADELPHIA",
  "EVERGLADES":"PORT EVERGLADES",
  "SPRING HILL":"SPRINGHILL",
  "DAP - NORTH SPRINGFIELD":"DAP NORTH SPRINGFIELD",
  "DESTINATION PORT":"","####":"",
};

const NORM_PORTO = {
  "ITAPOÁ":"ITAPOA","ITAJAÍ":"ITAJAI",
  "LOAD PORT":"","LOADING PORT":"","####":"",
  "CRICIUMA":"CRICIUMA",
};

/* Normalização de status de embarque */
const NORM_STATUS = {
  "DELIVERED":"ENTREGUE","ENTREGUE":"ENTREGUE",
  "IN TRANSIT":"EMBARCADO","EM TRÂNSITO":"EMBARCADO",
  "AT PORT":"NO PORTO","DISCHARGED":"NO PORTO",
  "AWAITING LOAD":"AGD ESTUFAGEM",
  "STATUS":"","AMOSTRA":"","status":"",
  "SINISTRO":"SINISTRO","CANCELADO":"CANCELADO",
  "EM PRODUÇÃO":"EM PRODUÇÃO","AGD ESTUFAGEM":"AGD ESTUFAGEM",
  "NO PORTO":"NO PORTO","EMBARCADO":"EMBARCADO","CARTEIRA":"CARTEIRA"
};

function normalize(rec) {
  const r = {...rec};
  if(r.cliente) r.cliente = NORM_CLIENTE[r.cliente] || r.cliente;
  if(r.destino) r.destino = NORM_DESTINO[r.destino] || r.destino;
  if(r.porto_origem) r.porto_origem = NORM_PORTO[r.porto_origem] || r.porto_origem;
  if(r.porto_carga) r.porto_carga = NORM_PORTO[r.porto_carga] || r.porto_carga;
  if(r.status) r.status = NORM_STATUS[r.status] !== undefined ? NORM_STATUS[r.status] : r.status;
  return r;
}

/* Aplicar normalização nos registros históricos em memória */
HIST_RECS.forEach((r,i) => { HIST_RECS[i] = normalize(r); });

const fmtUSD = v => (!v && v!==0) ? "—" : new Intl.NumberFormat("en-US",{style:"currency",currency:"USD",minimumFractionDigits:2}).format(v);
const fmtDate = d => { if(!d) return "—"; const dt=new Date(d+"T00:00:00"); return isNaN(dt)?"—":dt.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"}); };
const fmtInt = v => { if(v===null||v===undefined||v==="") return "—"; const s=String(v); return s.endsWith(".0")?s.slice(0,-2):s; };

/* ── Excel helpers ── */
function xlDate(d) {
  if(!d) return "";
  const dt = new Date(d+"T00:00:00");
  return isNaN(dt) ? "" : dt.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit",year:"numeric"});
}
function xlUSD(v) { return v ? Number(v) : ""; }
function xlInt(v) { if(v===null||v===undefined||v==="") return ""; const s=String(v); return s.endsWith(".0")?s.slice(0,-2):s; }

/* Styles constants for xlsx-js-style (we use XLSX which supports !cols/!rows but not cell styles in community build)
   We use a workaround: build rich HTML then convert, OR build formatted aoa with merged cells via XLSX.utils */

/* ══════════════════════════════════════════════════
   OPERACIONAL Excel Export — fiel ao modelo original
══════════════════════════════════════════════════ */
/* ══════════════════════════════════════════════════
   ESTILOS SALVARO para Excel (xlsx-js-style)
   Paleta: azul #1A6DC8, escuro #1A2B3C, cinza #F4F7FA
══════════════════════════════════════════════════ */
const XS = {
  title:   {font:{name:"Calibri",sz:14,bold:true,color:{rgb:"FFFFFF"}},fill:{fgColor:{rgb:"1A6DC8"}},alignment:{horizontal:"left",vertical:"center"},border:{bottom:{style:"medium",color:{rgb:"1A6DC8"}}}},
  subtitle:{font:{name:"Calibri",sz:10,bold:true,color:{rgb:"1A6DC8"}},alignment:{horizontal:"left",vertical:"center"}},
  mesLabel:{font:{name:"Calibri",sz:11,bold:true,color:{rgb:"FFFFFF"}},fill:{fgColor:{rgb:"1A2B3C"}},alignment:{horizontal:"left",vertical:"center"},border:{bottom:{style:"thin",color:{rgb:"1A2B3C"}}}},
  header:  {font:{name:"Calibri",sz:9,bold:true,color:{rgb:"FFFFFF"}},fill:{fgColor:{rgb:"1A6DC8"}},alignment:{horizontal:"center",vertical:"center",wrapText:true},border:{bottom:{style:"thin",color:{rgb:"135BA8"}},right:{style:"hair",color:{rgb:"4A90D9"}}}},
  row0:    {font:{name:"Calibri",sz:9,color:{rgb:"1A2B3C"}},alignment:{horizontal:"center",vertical:"center"},border:{bottom:{style:"hair",color:{rgb:"D9E2EC"}}}},
  row1:    {font:{name:"Calibri",sz:9,color:{rgb:"1A2B3C"}},fill:{fgColor:{rgb:"F4F7FA"}},alignment:{horizontal:"center",vertical:"center"},border:{bottom:{style:"hair",color:{rgb:"D9E2EC"}}}},
  total:   {font:{name:"Calibri",sz:10,bold:true,color:{rgb:"1A6DC8"}},fill:{fgColor:{rgb:"E8F1FB"}},alignment:{horizontal:"right",vertical:"center"},border:{top:{style:"thin",color:{rgb:"1A6DC8"}},bottom:{style:"double",color:{rgb:"1A6DC8"}}}},
  totalLbl:{font:{name:"Calibri",sz:10,bold:true,color:{rgb:"1A2B3C"}},fill:{fgColor:{rgb:"E8F1FB"}},alignment:{horizontal:"right",vertical:"center"},border:{top:{style:"thin",color:{rgb:"1A6DC8"}},bottom:{style:"double",color:{rgb:"1A6DC8"}}}},
  date:    {font:{name:"Calibri",sz:8,color:{rgb:"6B7280"}},alignment:{horizontal:"right"}},
};

function applyStyle(ws, ref, style) {
  if(!ws[ref]) ws[ref] = {t:"s",v:""};
  ws[ref].s = style;
}

function applyRowStyles(ws, rowIdx, colCount, style) {
  for(let c=0;c<colCount;c++){
    const ref = XLSX.utils.encode_cell({r:rowIdx,c});
    applyStyle(ws, ref, style);
  }
}

function exportOperacionalXLS(ant, antRows, vig, vigRows, seg, segRows) {
  const today = new Date().toLocaleDateString("pt-BR");
  const aoa = [];
  const COLS = 13;

  /* Row 0: title bar */
  aoa.push(["CONTROLE OPERACIONAL DE EMBARQUES","","","","","","","","","","","ATUALIZADO EM",today]);

  const sectionStarts = [];
  const merges = [{s:{r:0,c:0},e:{r:0,c:10}}];

  function pushSection(mesLabel, rows) {
    aoa.push([]); /* spacer */
    const startRow = aoa.length;
    sectionStarts.push({start:startRow, dataStart:startRow+2, dataEnd:startRow+2+rows.length-1, totalRow:startRow+2+rows.length});
    aoa.push([mesLabel,"","","","","","","","","","","",""]);
    merges.push({s:{r:startRow,c:0},e:{r:startRow,c:COLS-1}});
    aoa.push(["INV","CLIENTE","PO#","NF","DESTINO","ETA","AGENTE","BOOKING","CONTAINER","NAVIO","DL CARGA","ESTUFAGEM","TRANSP."]);
    rows.forEach((r,i) => {
      aoa.push([
        r.invoice||"", r.cliente||"", xlInt(r.po), xlInt(r.nf), r.destino||"",
        xlDate(r.eta_pedido), r.agente||"", xlInt(r.booking), r.container||"", r.navio||"",
        xlDate(r.dl_carga), xlDate(r.estufagem), r.transportadora||""
      ]);
    });
    const totalUSD = rows.reduce((s,r)=>s+(r.valor_usd||0),0);
    aoa.push(["","","TOTAL USD:","","$"+totalUSD.toFixed(2),"","","Nº CONTAINERS:",rows.length,"","","",""]);
  }

  pushSection(ant, antRows);
  pushSection(vig, vigRows);
  pushSection(seg, segRows);

  const ws = XLSX.utils.aoa_to_sheet(aoa);

  /* Title row */
  for(let c=0;c<COLS;c++) applyStyle(ws, XLSX.utils.encode_cell({r:0,c}), XS.title);
  applyStyle(ws, XLSX.utils.encode_cell({r:0,c:11}), {font:{name:"Calibri",sz:8,color:{rgb:"6B7280"}},fill:{fgColor:{rgb:"1A6DC8"}},alignment:{horizontal:"right"},border:XS.title.border});
  applyStyle(ws, XLSX.utils.encode_cell({r:0,c:12}), {font:{name:"Calibri",sz:8,color:{rgb:"FFFFFF"}},fill:{fgColor:{rgb:"1A6DC8"}},alignment:{horizontal:"right"},border:XS.title.border});

  /* Each section */
  sectionStarts.forEach(sec => {
    for(let c=0;c<COLS;c++) applyStyle(ws, XLSX.utils.encode_cell({r:sec.start,c}), {...XS.mesLabel, alignment:{horizontal:"center",vertical:"center"}});
    applyRowStyles(ws, sec.start+1, COLS, XS.header);
    for(let r=sec.dataStart;r<=sec.dataEnd;r++){
      applyRowStyles(ws, r, COLS, (r-sec.dataStart)%2===0?XS.row1:XS.row0);
    }
    for(let c=0;c<COLS;c++){
      const ref = XLSX.utils.encode_cell({r:sec.totalRow,c});
      applyStyle(ws, ref, (c===4)?XS.total:XS.totalLbl);
    }
  });

  ws["!merges"] = merges;
  ws["!cols"] = [
    {wch:8.9},{wch:14.9},{wch:12.9},{wch:8.9},{wch:13.9},
    {wch:10.9},{wch:20.9},{wch:13.9},{wch:15.9},{wch:18.9},{wch:11.9},{wch:11},{wch:10.9}
  ];
  ws["!rows"] = [{hpx:28}];
  ws["!pageSetup"] = {orientation:"landscape",paperSize:9,fitToWidth:1,fitToHeight:0,fitToPage:true};
  ws["!printOptions"] = {gridLines:false};
  ws["!margins"] = {left:0.4,right:0.4,top:0.6,bottom:0.5,header:0.3,footer:0.3};

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "OPERACIONAL");
  XLSX.writeFile(wb, `Operacional_${vig.replace(" ","_")}.xlsx`);
}


/* ══════════════════════════════════════════════════
   CARTEIRA Excel Export — fiel ao modelo original
   Layout: Mês1 (cols B-G) | Mês2 (cols J-O) | Mês3 abaixo
══════════════════════════════════════════════════ */
function exportCarteiraXLS(m1, rows1, m2, rows2, m3, rows3) {
  const today = new Date().toLocaleDateString("pt-BR");
  const aoa = [];
  const TCOLS = 15; /* A-O */

  /* Row 0: title (merge B1:M1) */
  aoa.push(["","PROGRAMAÇÃO DE EMBARQUES / ETAs SOLICITADOS","","","","","","","","","","","","ATUALIZADO EM",today]);
  aoa.push([]); /* spacer */

  /* Row 2: month labels (merged B3:G3 and J3:O3) */
  aoa.push(["",m1,"","","","","","","",m2,"","","","",""]);

  /* Row 3: headers */
  const HDR = ["INV","CLIENTE","PO#","USD","DESTINO","ETA"];
  aoa.push(["", ...HDR, "","", ...HDR]);

  const maxRows12 = Math.max(rows1.length, rows2.length);

  for(let i=0;i<maxRows12;i++){
    const r1=rows1[i], r2=rows2[i];
    aoa.push([
      "",
      r1?r1.invoice:"", r1?r1.cliente:"", r1?xlInt(r1.po):"", r1?xlUSD(r1.valor_usd):"", r1?r1.destino:"", r1?xlDate(r1.eta_pedido):"",
      "","",
      r2?r2.invoice:"", r2?r2.cliente:"", r2?xlInt(r2.po):"", r2?xlUSD(r2.valor_usd):"", r2?r2.destino:"", r2?xlDate(r2.eta_pedido):""
    ]);
  }

  const t1=rows1.reduce((s,r)=>s+(r.valor_usd||0),0);
  const t2=rows2.reduce((s,r)=>s+(r.valor_usd||0),0);
  const totRow12 = aoa.length;
  aoa.push(["","","TOTAL:","","$"+t1.toFixed(2),"","","","","","TOTAL:","","$"+t2.toFixed(2),"",""]);
  const cntRow12 = aoa.length;
  aoa.push(["","","Nº containers:",rows1.length,"","","","","","","Nº containers:",rows2.length,"","",""]);
  aoa.push([]);

  const m3Start = aoa.length;
  aoa.push(["",m3,"","","","",""]); /* merge B:G */
  aoa.push(["", ...HDR]);
  rows3.forEach(r=>{
    aoa.push(["",r.invoice||"",r.cliente||"",xlInt(r.po),xlUSD(r.valor_usd),r.destino||"",xlDate(r.eta_pedido)]);
  });
  const t3=rows3.reduce((s,r)=>s+(r.valor_usd||0),0);
  const totRow3 = aoa.length;
  aoa.push(["","","TOTAL:","","$"+t3.toFixed(2),"",""]);
  const cntRow3 = aoa.length;
  aoa.push(["","","Nº containers:",rows3.length,"","",""]);

  const ws = XLSX.utils.aoa_to_sheet(aoa);

  /* ── Styles ── */
  /* Title row - bg across all, with ATUALIZADO in col N/O */
  for(let c=0;c<TCOLS;c++) applyStyle(ws, XLSX.utils.encode_cell({r:0,c}), XS.title);
  applyStyle(ws, XLSX.utils.encode_cell({r:0,c:13}), {font:{name:"Calibri",sz:9,bold:true,color:{rgb:"FFFFFF"}},fill:{fgColor:{rgb:"1A6DC8"}},alignment:{horizontal:"left"},border:XS.title.border});
  applyStyle(ws, XLSX.utils.encode_cell({r:0,c:14}), XS.title);

  /* Row 2: month labels - full row dark bg, center on merges */
  for(let c=0;c<TCOLS;c++) applyStyle(ws, XLSX.utils.encode_cell({r:2,c}), {...XS.mesLabel, alignment:{horizontal:(c>=1&&c<=6)||(c>=9&&c<=14)?"center":"left",vertical:"center"}});

  /* Row 3: headers */
  for(let c=0;c<TCOLS;c++){
    const isGap = c===7||c===8;
    applyStyle(ws, XLSX.utils.encode_cell({r:3,c}), isGap?XS.row0:XS.header);
  }

  /* Data zebra m1+m2 */
  for(let r=4;r<4+maxRows12;r++){
    for(let c=0;c<TCOLS;c++){
      const isGap = c===7||c===8;
      const isZebra = (r-4)%2===0;
      applyStyle(ws, XLSX.utils.encode_cell({r,c}), isGap?{}:(isZebra?XS.row1:XS.row0));
    }
  }

  /* Totals m1+m2 */
  for(let c=0;c<TCOLS;c++){
    const isGap = c===7||c===8;
    applyStyle(ws, XLSX.utils.encode_cell({r:totRow12,c}), isGap?{}:XS.total);
    applyStyle(ws, XLSX.utils.encode_cell({r:cntRow12,c}), isGap?{}:XS.totalLbl);
  }

  /* m3 section */
  for(let c=0;c<7;c++) applyStyle(ws, XLSX.utils.encode_cell({r:m3Start,c}), {...XS.mesLabel, alignment:{horizontal:"left",vertical:"center"}});
  for(let c=0;c<7;c++) applyStyle(ws, XLSX.utils.encode_cell({r:m3Start+1,c}), XS.header);
  for(let r=m3Start+2;r<m3Start+2+rows3.length;r++){
    const isZebra = (r-m3Start-2)%2===0;
    for(let c=0;c<7;c++) applyStyle(ws, XLSX.utils.encode_cell({r,c}), isZebra?XS.row0:XS.row1);
  }
  for(let c=0;c<7;c++){
    applyStyle(ws, XLSX.utils.encode_cell({r:totRow3,c}), XS.total);
    applyStyle(ws, XLSX.utils.encode_cell({r:cntRow3,c}), XS.totalLbl);
  }

  /* Merges matching reference */
  ws["!merges"] = [
    {s:{r:0,c:1},e:{r:0,c:12}},     /* B1:M1 title */
    {s:{r:2,c:1},e:{r:2,c:6}},       /* B3:G3 m1 label */
    {s:{r:2,c:9},e:{r:2,c:14}},      /* J3:O3 m2 label */
    {s:{r:m3Start,c:1},e:{r:m3Start,c:6}}, /* B:G m3 label */
  ];

  /* Col widths matching reference exactly */
  ws["!cols"] = [
    {wch:2.9},{wch:8.9},{wch:14.9},{wch:12.9},{wch:13.9},{wch:14.9},{wch:12.9},
    {wch:1.9},{wch:1},
    {wch:8.9},{wch:14.9},{wch:12.9},{wch:13.9},{wch:14.9},{wch:12.9}
  ];

  ws["!rows"] = [{hpx:28}];

  ws["!pageSetup"] = {orientation:"landscape",paperSize:9,fitToWidth:1,fitToHeight:0,fitToPage:true};
  ws["!printOptions"] = {gridLines:false};
  ws["!margins"] = {left:0.4,right:0.4,top:0.6,bottom:0.5,header:0.3,footer:0.3};

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "CARTEIRA");
  XLSX.writeFile(wb, `Carteira_${m1.replace(" ","_")}.xlsx`);
}

/* ── Badges ── */
const DocBadge = ({v}) => {
  if(!v) return <span className="badge bgg">—</span>;
  if(v==="COMPLETO") return <span className="badge bge">✓ Completo</span>;
  if(v==="FALTA BL") return <span className="badge bgy">⏳ Falta BL</span>;
  return <span className="badge bgr">⚠ Pendente</span>;
};
const EmbBadge = ({v}) => {
  if(!v) return <span className="badge bgg">—</span>;
  const m={
    "CARTEIRA":"bgcart","EM PRODUÇÃO":"bgprod","AGD ESTUFAGEM":"bgy",
    "NO PORTO":"bgo","EMBARCADO":"bgb","ENTREGUE":"bge",
    "SINISTRO":"bgr","CANCELADO":"bgr"
  };
  return <span className={`badge ${m[v]||"bgg"}`}>{v}</span>;
};

const Toast = ({msg,type,onClose}) => {
  useEffect(()=>{const t=setTimeout(onClose,3500);return()=>clearTimeout(t);},[]);
  return <div className={`toast ${type==="ok"?"tok":"ter"}`}>{msg}</div>;
};

/* Field component — definido FORA dos componentes que o usam para preservar
   identidade entre renders (senão o React desmonta o input a cada tecla
   digitada e o foco se perde) */
const Field = ({label,field,type="text",opts=null,form,upd}) => (
  <div className="field">
    <label>{label}</label>
    {opts
      ? <select value={form[field]||""} onChange={e=>upd(field,e.target.value)}>
          <option value="">— selecione —</option>
          {opts.map(o=><option key={o}>{o}</option>)}
        </select>
      : <input type={type} value={form[field]||""} onChange={e=>upd(field,e.target.value)}/>}
  </div>
);

const Bar = ({data,color="#1A6DC8",fmt,total}) => {
  const max=Math.max(...data.map(d=>d.v),1);
  return <div>{data.map((d,i)=>(
    <div key={i} className="br2">
      <div className="bl2" title={d.l}>{d.l}</div>
      <div className="bt"><div className="bf" style={{width:`${(d.v/max)*100}%`,background:color}}/></div>
      <div className="bv">{fmt?fmt(d.v):d.v}{total?<span style={{color:"#94A3B8",fontSize:10,marginLeft:3}}>({(d.v/total*100).toFixed(1)}%)</span>:null}</div>
    </div>
  ))}</div>;
};

const Donut = ({data}) => {
  const total=data.reduce((s,d)=>s+d.v,0);
  if(!total) return null;
  const r=38,cx=55,cy=55,circ=2*Math.PI*r;
  const COLS=["#1A6DC8","#D97706","#059669","#EA580C","#7C3AED","#DC2626","#DB2777","#0891B2"];
  let off=0;
  const segs=data.map((d,i)=>{const pct=d.v/total,dash=pct*circ,seg={...d,dash,off:off*circ,c:COLS[i%COLS.length]};off+=pct;return seg;});
  return <div style={{display:"flex",alignItems:"center",gap:16}}>
    <svg width="110" height="110" viewBox="0 0 110 110" style={{flexShrink:0}}>
      <circle cx={cx} cy={cy} r={r} fill="none" stroke="#EEF2F6" strokeWidth="14"/>
      {segs.map((s,i)=><circle key={i} cx={cx} cy={cy} r={r} fill="none" stroke={s.c} strokeWidth="14"
        strokeDasharray={`${s.dash} ${circ-s.dash}`} strokeDashoffset={circ/4-s.off}/>)}
      <text x={cx} y={cy+5} textAnchor="middle" fill="#1A2B3C" fontSize="14" fontWeight="700" fontFamily="Syne">{total}</text>
    </svg>
    <div style={{display:"flex",flexDirection:"column",gap:7}}>
      {segs.map((s,i)=><div key={i} style={{display:"flex",alignItems:"center",gap:8,fontSize:12}}>
        <div style={{width:9,height:9,borderRadius:"50%",background:s.c,flexShrink:0}}/>
        <span style={{color:"#5A7288"}}>{s.l}</span>
        <span style={{marginLeft:"auto",fontWeight:600,paddingLeft:10,color:"#1A2B3C"}}>{s.v}</span>
      </div>)}
    </div>
  </div>;
};

/* Gráfico de linha temporal para séries longas (modo "TODOS") */
const LineChart = ({data, fmt, height=220}) => {
  const [hover,setHover]=useState(null);
  if(!data||!data.length) return null;

  const W=680, H=height, padL=60, padR=20, padT=20, padB=40;
  const chartW=W-padL-padR, chartH=H-padT-padB;
  const max=Math.max(...data.map(d=>d.v),1);
  const n=data.length;

  /* Posições X e Y */
  const px = (i) => padL + (i/(n-1||1))*chartW;
  const py = (v) => padT + chartH - (v/max)*chartH;

  /* Polyline path */
  const pts = data.map((d,i)=>`${px(i)},${py(d.v)}`).join(" ");

  /* Area fill path */
  const area = `M${px(0)},${py(0)} ${data.map((d,i)=>`L${px(i)},${py(d.v)}`).join(" ")} L${px(n-1)},${padT+chartH} L${px(0)},${padT+chartH} Z`;

  /* Grid lines Y (5 linhas) */
  const gridY = Array.from({length:5},(_, i)=>{
    const val = max * (i+1)/5;
    const y = py(val);
    return {y, label: "$"+Math.round(val/1000)+"k"};
  });

  /* Labels X — mostrar apenas marcadores de ano (JAN de cada ano) */
  const yearMarks = [];
  let lastAno="";
  data.forEach((d,i)=>{
    if(d.ano && d.ano !== lastAno){
      yearMarks.push({x:px(i), label:d.ano});
      lastAno=d.ano;
    }
  });

  return <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{overflow:"visible"}}
    onMouseLeave={()=>setHover(null)}>
    {/* Grid horizontal */}
    {gridY.map((g,i)=><g key={i}>
      <line x1={padL} y1={g.y} x2={W-padR} y2={g.y} stroke="var(--border)" strokeWidth="0.5" strokeDasharray="4 3"/>
      <text x={padL-8} y={g.y+4} textAnchor="end" fill="var(--text3)" fontSize="10" fontFamily="DM Sans,sans-serif">{g.label}</text>
    </g>)}

    {/* Eixo base */}
    <line x1={padL} y1={padT+chartH} x2={W-padR} y2={padT+chartH} stroke="var(--border)" strokeWidth="0.5"/>

    {/* Labels de ano no eixo X */}
    {yearMarks.map((m,i)=><g key={i}>
      <line x1={m.x} y1={padT+chartH} x2={m.x} y2={padT+chartH+6} stroke="var(--text3)" strokeWidth="0.5"/>
      <text x={m.x} y={padT+chartH+20} textAnchor="middle" fill="var(--text2)" fontSize="10" fontWeight="500" fontFamily="DM Sans,sans-serif">{m.label}</text>
    </g>)}

    {/* Area preenchida */}
    <path d={area} fill="var(--blue)" opacity="0.08"/>

    {/* Linha principal */}
    <polyline points={pts} fill="none" stroke="var(--blue)" strokeWidth="2" strokeLinejoin="round" strokeLinecap="round"/>

    {/* Hit areas invisíveis + pontos + tooltip */}
    {data.map((d,i)=>{
      const cx=px(i), cy_=py(d.v);
      const isHover = hover===i;
      return <g key={i}>
        <rect x={cx-Math.max(chartW/n/2,4)} y={padT} width={Math.max(chartW/n,8)} height={chartH}
          fill="transparent" onMouseEnter={()=>setHover(i)} style={{cursor:"crosshair"}}/>
        {isHover&&<>
          <line x1={cx} y1={padT} x2={cx} y2={padT+chartH} stroke="var(--blue)" strokeWidth="0.5" strokeDasharray="3 3" opacity="0.5"/>
          <circle cx={cx} cy={cy_} r={4} fill="var(--blue)" stroke="#fff" strokeWidth="2"/>
          <g>
            <rect x={cx-48} y={cy_-36} width={96} height={28} rx={6} fill="var(--text)" opacity="0.9"/>
            <text x={cx} y={cy_-22} textAnchor="middle" fill="#fff" fontSize="10" fontFamily="DM Sans,sans-serif" fontWeight="500">{d.full||d.l}</text>
            <text x={cx} y={cy_-12} textAnchor="middle" fill="#fff" fontSize="10" fontFamily="DM Sans,sans-serif" opacity="0.8">{fmt?fmt(d.v):d.v}</text>
          </g>
        </>}
      </g>;
    })}
  </svg>;
};

/* ══════════════════════════════════════════
   LOGIN — Tela de autenticação
══════════════════════════════════════════ */
function Login({onLogin, notify}) {
  const [email,setEmail]=useState("");
  const [pwd,setPwd]=useState("");
  const [busy,setBusy]=useState(false);
  const [err,setErr]=useState("");

  async function handleLogin(e) {
    e.preventDefault();
    setErr("");
    if(!email || !pwd) { setErr("Preencha email e senha"); return; }
    setBusy(true);
    const {data, error} = await db.auth.signInWithPassword({email, password: pwd});
    setBusy(false);
    if(error) {
      setErr(error.message === "Invalid login credentials" 
        ? "Email ou senha incorretos" 
        : error.message);
      return;
    }
    onLogin(data.session);
  }

  return <>
    <style>{CSS}</style>
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"#F0F2F5",padding:20}}>
      <div style={{background:"#fff",borderRadius:14,padding:"36px 32px",width:"100%",maxWidth:380,boxShadow:"0 4px 24px rgba(0,0,0,0.08)",border:"1px solid #D8E2EB"}}>
        <div style={{textAlign:"center",marginBottom:28}}>
          <h1 style={{fontFamily:"Syne,sans-serif",fontSize:30,fontWeight:800,color:"#1A6DC8",letterSpacing:-1,margin:0}}>
            SALV<span style={{color:"#D97706"}}>ARO</span>
          </h1>
          <p style={{fontSize:12,color:"#5A7288",marginTop:6,letterSpacing:1.5,textTransform:"uppercase"}}>Export Control</p>
        </div>
        <form onSubmit={handleLogin}>
          <div style={{marginBottom:14}}>
            <label style={{display:"block",fontSize:11,fontWeight:600,color:"#5A7288",letterSpacing:.5,textTransform:"uppercase",marginBottom:6}}>Email</label>
            <input type="email" value={email} onChange={e=>setEmail(e.target.value)} autoComplete="username"
              style={{width:"100%",padding:"10px 12px",fontSize:14,border:"1px solid #D8E2EB",borderRadius:8,fontFamily:"DM Sans,sans-serif",outline:"none",color:"#1A2B3C"}}
              onFocus={e=>e.target.style.borderColor="#1A6DC8"} onBlur={e=>e.target.style.borderColor="#D8E2EB"} />
          </div>
          <div style={{marginBottom:18}}>
            <label style={{display:"block",fontSize:11,fontWeight:600,color:"#5A7288",letterSpacing:.5,textTransform:"uppercase",marginBottom:6}}>Senha</label>
            <input type="password" value={pwd} onChange={e=>setPwd(e.target.value)} autoComplete="current-password"
              style={{width:"100%",padding:"10px 12px",fontSize:14,border:"1px solid #D8E2EB",borderRadius:8,fontFamily:"DM Sans,sans-serif",outline:"none",color:"#1A2B3C"}}
              onFocus={e=>e.target.style.borderColor="#1A6DC8"} onBlur={e=>e.target.style.borderColor="#D8E2EB"} />
          </div>
          {err && <div style={{background:"#FEF2F2",border:"1px solid #FECACA",color:"#991B1B",padding:"9px 12px",borderRadius:8,fontSize:12,marginBottom:14}}>{err}</div>}
          <button type="submit" disabled={busy}
            style={{width:"100%",padding:"11px",fontSize:14,fontWeight:600,background:busy?"#94A8BA":"#1A6DC8",color:"#fff",border:"none",borderRadius:8,cursor:busy?"wait":"pointer",fontFamily:"DM Sans,sans-serif",transition:"background .15s"}}>
            {busy ? "Entrando..." : "Entrar"}
          </button>
        </form>
        <div style={{marginTop:20,paddingTop:16,borderTop:"1px solid #EEF2F6",fontSize:11,color:"#94A8BA",textAlign:"center",lineHeight:1.5}}>
          Acesso restrito à equipe Salvaro.<br/>Em caso de problemas com login, contate o administrador do sistema.
        </div>
      </div>
    </div>
  </>;
}

function App() {
  const [session,setSession]=useState(null);
  const [authChecking,setAuthChecking]=useState(true);
  const [recs,setRecs]=useState([]);
  const [loading,setLoading]=useState(false);
  const [toast,setToast]=useState(null);
  const notify=useCallback((msg,type="ok")=>setToast({msg,type}),[]);

  /* ── Hook de persistência: sincroniza estado com localStorage ── */
  function usePersist(key, defaultVal) {
    const [val, setVal] = useState(() => {
      try { const s = localStorage.getItem("sv_"+key); return s !== null ? JSON.parse(s) : defaultVal; }
      catch { return defaultVal; }
    });
    const set = useCallback(v => {
      setVal(v);
      try { localStorage.setItem("sv_"+key, JSON.stringify(v)); } catch {}
    },[key]);
    return [val, set];
  }

  /* ── Estados persistentes de todos os filtros ── */
  const _now=new Date(),_ci=_now.getMonth(),_cy=String(_now.getFullYear());
  const _pi=_ci===0?11:_ci-1, _py=_ci===0?String(_now.getFullYear()-1):_cy;
  const _ni=(_ci+1)%12, _ny=_ci===11?String(_now.getFullYear()+1):_cy;
  const _n2=(_ci+2)%12, _n2y=_ci>=10?String(_now.getFullYear()+1):_cy;

  /* Aba ativa */
  const [pg,setPg]=usePersist("pg","dash");
  /* Operacional - 3 meses */
  const [opsAnt,setOpsAnt]=usePersist("opsAnt",MESES[_pi]+" "+_py);
  const [opsVig,setOpsVig]=usePersist("opsVig",MESES[_ci]+" "+_cy);
  const [opsSeg,setOpsSeg]=usePersist("opsSeg",MESES[_ni]+" "+_ny);
  /* Carteira - 3 meses */
  /* Carteira: sempre mês vigente + 2 próximos (automático) */
  const cartM1 = MESES[_ci]+" "+_cy;
  const cartM2 = MESES[_ni]+" "+_ny;
  const cartM3 = MESES[_n2]+" "+_n2y;
  /* Dashboard - ano */
  const [dashYr,setDashYr]=usePersist("dashYr","2026");
  /* Base de Dados - filtros */
  const [baseQ,setBaseQ]=usePersist("baseQ","");
  const [baseFC,setBaseFC]=usePersist("baseFC","");
  const [baseFM,setBaseFM]=usePersist("baseFM","");
  const [baseFD,setBaseFD]=usePersist("baseFD","");
  /* Relatórios - tab, ano, mês */
  const [relTab,setRelTab]=usePersist("relTab","mensal");
  const [relYr,setRelYr]=usePersist("relYr","2026");
  const [relMes,setRelMes]=usePersist("relMes","ABRIL 2026");

  /* Restaurar sessão salva ao iniciar e escutar mudanças de auth */
  useEffect(()=>{
    db.auth.getSession().then(({data})=>{
      setSession(data.session);
      setAuthChecking(false);
    });
    const {data:{subscription}} = db.auth.onAuthStateChange((event, sess)=>{
      /* Só reage a login/logout real — ignora TOKEN_REFRESHED para não disparar reload */
      if(event==="SIGNED_IN"||event==="SIGNED_OUT"||event==="USER_UPDATED"){
        setSession(sess);
      }
    });
    return ()=>subscription.unsubscribe();
  },[]);

  /* Carregar dados apenas no login inicial — não recarrega a cada refresh de token */
  const loadedUid = React.useRef(null);
  useEffect(()=>{
    if(session){
      const uid = session.user?.id;
      if(uid && uid !== loadedUid.current){
        loadedUid.current = uid;
        load();
      }
    } else {
      loadedUid.current = null;
      setRecs(HIST_RECS);
    }
  },[session]);

  /* Carga inicial: mostra spinner durante a primeira requisição */
  async function load() {
    setLoading(true);
    await fetchData();
    setLoading(false);
  }

  /* Recarga silenciosa: atualiza dados em background SEM desmontar a tela.
     Usado após salvar/excluir para que filtros, busca e scroll sejam preservados. */
  async function refresh() {
    await fetchData();
  }

  /* ── Cadastros dinâmicos ── */
  const [cadData,setCadData]=useState({clientes:[],destinos:[],portos:[],transportadoras:[]});

  async function loadCadastros() {
    const tables = ["cadastro_clientes","cadastro_destinos","cadastro_portos","cadastro_transportadoras"];
    const keys = ["clientes","destinos","portos","transportadoras"];
    const result = {};
    for(let i=0;i<tables.length;i++){
      const {data}=await db.from(tables[i]).select("*").order("nome");
      result[keys[i]] = (data||[]).map(r=>r.nome);
    }
    setCadData(result);
  }

  /* Carregar cadastros junto com os dados */
  useEffect(()=>{
    if(session) loadCadastros();
  },[session]);

  async function fetchData() {
    const {data,error}=await db.from("exportacoes").select("*").order("invoice");
    if(error) {
      if(error.message.includes("JWT") || error.code === "PGRST301") {
        notify("Sessão expirada. Faça login novamente.","err");
        await db.auth.signOut();
      } else {
        notify("Erro: "+error.message,"err");
      }
      return;
    }
    const liveRecs = (data || []).map(normalize);
    /* Deduplicar: se um registro do Supabase tem a mesma invoice que um HIST_REC,
       usar o do Supabase (mais atualizado). Se não tem match, manter ambos.
       Registros históricos sem match no Supabase são preservados. */
    const liveInvoices = new Set(liveRecs.map(r=>r.invoice));
    const histOnly = HIST_RECS.filter(r=>!liveInvoices.has(r.invoice));
    const merged = [...histOnly, ...liveRecs];
    setRecs(merged);
  }

  async function save(rec) {
    /* Limpar strings vazias em campos de data — PostgreSQL exige null, não "" */
    const DATE_FIELDS = ["isf_docs","bl","dl_carga","estufagem","eta_pedido","etd","eta","data_pagamento"];
    const clean = {...rec};
    DATE_FIELDS.forEach(f=>{ if(clean[f]==="") clean[f]=null; });
    /* Limpar campos numéricos vazios */
    ["valor_usd","frete_usd"].forEach(f=>{ if(clean[f]==="") clean[f]=null; });
    const {error}=await db.from("exportacoes").upsert(clean,{onConflict:"invoice"});
    if(error){notify("Erro ao salvar: "+error.message,"err");return false;}
    await refresh(); notify("Salvo com sucesso!"); return true;
  }

  async function remove(invoice) {
    const {error}=await db.from("exportacoes").delete().eq("invoice",invoice);
    if(error){notify("Erro ao excluir","err");return;}
    await refresh(); notify("Excluído.");
  }

  async function logout() {
    await db.auth.signOut();
    setRecs([]);
    notify("Sessão encerrada.");
  }

  /* Estados de carregamento de auth e tela de login */
  if(authChecking) {
    return <>
      <style>{CSS}</style>
      <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",fontFamily:"Syne,sans-serif",color:"#1A6DC8",fontSize:15,gap:12}}>
        <div style={{width:22,height:22,border:"3px solid #D8E2EB",borderTopColor:"#1A6DC8",borderRadius:"50%",animation:"spin .7s linear infinite"}}/>
        Verificando sessão...
      </div>
    </>;
  }
  if(!session) return <Login onLogin={setSession} notify={notify}/>;

  const NAV=[
    {id:"dash",ic:IC.dash,lb:"Dashboard"},
    {id:"ops", ic:IC.ops, lb:"Operacional"},
    {id:"cart",ic:IC.cart,lb:"Carteira"},
    {id:"ship",ic:IC.ship,lb:"Shipping"},
    {id:"rec", ic:IC.rec, lb:"Recebimentos"},
    {id:"base",ic:IC.db,  lb:"Base de Dados"},
    {id:"cad", ic:IC.cad, lb:"Cadastros"},
    {id:"pell",ic:IC.ship,lb:"Pellets 🌲"},
    {id:"rel", ic:IC.rep, lb:"Relatórios"},
  ];

  const userEmail = session.user?.email || "";
  const userInitial = userEmail.charAt(0).toUpperCase();

  return <>
    <style>{CSS}</style>
    <div className="app">
      <aside className="sidebar">
        <div className="logo">
          <h1>SALV<span>ARO</span></h1>
          <p>Export Control</p>
        </div>
        <div className="nav">
          <div className="nlbl">Navegação</div>
          {NAV.map(n=>(
            <div key={n.id} className={`ni${pg===n.id?" on":""}`} onClick={()=>setPg(n.id)}>
              {n.ic}<span>{n.lb}</span>
            </div>
          ))}
        </div>
        <div className="sft">
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8,padding:"8px 4px",borderTop:"1px solid #2D3F52",borderBottom:"1px solid #2D3F52"}}>
            <div style={{width:28,height:28,borderRadius:"50%",background:"#1A6DC8",color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,fontSize:12,fontFamily:"Syne,sans-serif",flexShrink:0}}>{userInitial}</div>
            <div style={{flex:1,minWidth:0,overflow:"hidden"}}>
              <div style={{fontSize:11,color:"#fff",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}} title={userEmail}>{userEmail}</div>
              <div onClick={logout} style={{fontSize:10,color:"#94A8BA",cursor:"pointer",marginTop:2}} onMouseEnter={e=>e.target.style.color="#fff"} onMouseLeave={e=>e.target.style.color="#94A8BA"}>Sair</div>
            </div>
          </div>
          <div>v2.5 · Supabase</div>
          <div style={{color:"var(--green)",marginTop:3}}>● {recs.length} registros</div>
        </div>
      </aside>
      <main className="main">
        {loading
          ? <div className="lw"><div className="spin2"/></div>
          : <>
              {pg==="dash" && <PgDash recs={recs} yr={dashYr} setYr={setDashYr}/>}
              {pg==="ops"  && <PgOps  recs={recs} ant={opsAnt} setAnt={setOpsAnt} vig={opsVig} setVig={setOpsVig} seg={opsSeg} setSeg={setOpsSeg}/>}
              {pg==="cart" && <PgCart recs={recs} m1={cartM1} m2={cartM2} m3={cartM3}/>}
              {pg==="ship" && <PgShip recs={recs}/>}
              {pg==="rec"  && <PgRec  recs={recs} onSave={save} refresh={refresh} notify={notify}/>}
              {pg==="base" && <PgBase recs={recs} onSave={save} onDel={remove} notify={notify} q={baseQ} setQ={setBaseQ} fC={baseFC} setFC={setBaseFC} fM={baseFM} setFM={setBaseFM} fD={baseFD} setFD={setBaseFD} cadData={cadData}/>}
              {pg==="cad"  && <PgCad  cadData={cadData} refreshCad={loadCadastros} notify={notify}/>}
              {pg==="pell" && <PgPell notify={notify} session={session}/>}
              {pg==="rel"  && <PgRel  recs={recs} tab={relTab} setTab={setRelTab} yr={relYr} setYr={setRelYr} mes={relMes} setMes={setRelMes} notify={notify}/>}
            </>
        }
      </main>
    </div>
    {toast && <Toast msg={toast.msg} type={toast.type} onClose={()=>setToast(null)}/>}
  </>;
}

/* ══════════════════════════════════════════
   DASHBOARD
══════════════════════════════════════════ */
function PgDash({recs, yr, setYr}) {

  /* merge live data with historical */
  /* Agregar totais anuais diretamente a partir de recs (que já inclui HIST_RECS + live).
     NÃO usar {...HIST} como base, senão os anos históricos são contados duas vezes. */
  const allYears = useMemo(()=>{
    const m={};
    recs.forEach(r=>{
      const y=r.mes_ref?.split(" ")[1]; if(!y) return;
      if(!m[y]) m[y]={fat:0,cnt:0,fret:0};
      m[y].fat+=r.valor_usd||0; m[y].cnt++; m[y].fret+=r.frete_usd||0;
    });
    return m;
  },[recs]);

  const fil=useMemo(()=>yr==="TODOS"?recs:recs.filter(r=>r.mes_ref?.includes(yr)),[recs,yr]);
  const fat=fil.reduce((s,r)=>s+(r.valor_usd||0),0);
  const fret=fil.reduce((s,r)=>s+(r.frete_usd||0),0);
  const cnt=fil.length;

  /* ── YoY: mesmo período do ano anterior ── */
  const prevYr = yr==="TODOS"?null:String(parseInt(yr)-1);
  const filPrev = useMemo(()=>{
    if(!prevYr) return [];
    /* Se estamos no meio do ano, comparar até o último mês disponível do ano atual */
    const mesesAtual = new Set(fil.map(r=>r.mes_ref?.split(" ")[0]).filter(Boolean));
    return recs.filter(r=>{
      if(!r.mes_ref?.includes(prevYr)) return false;
      const mes = r.mes_ref.split(" ")[0];
      return mesesAtual.has(mes);
    });
  },[recs,yr,prevYr,fil]);
  const fatPrev=filPrev.reduce((s,r)=>s+(r.valor_usd||0),0);
  const fretPrev=filPrev.reduce((s,r)=>s+(r.frete_usd||0),0);
  const cntPrev=filPrev.length;

  /* Badge de variação YoY */
  const YoY = ({cur, prev, invert=false}) => {
    if(!prev || !prevYr || yr==="TODOS") return null;
    const pct = ((cur/prev)-1)*100;
    const up = pct >= 0;
    const good = invert ? !up : up;
    const color = good ? "#059669" : "#DC2626";
    const arrow = up ? "▲" : "▼";
    return <div style={{display:"inline-flex",alignItems:"center",gap:3,fontSize:11,fontWeight:600,color,marginTop:4}}>
      <span>{arrow}</span>
      <span>{Math.abs(pct).toFixed(1)}%</span>
      <span style={{fontWeight:400,color:"var(--text3)",fontSize:10}}>vs {prevYr}</span>
    </div>;
  };

  const byMonth=useMemo(()=>{
    const m={};
    fil.forEach(r=>{const k=r.mes_ref||"?";if(!m[k])m[k]={v:0,mes:k.split(" ")[0],ano:k.split(" ")[1]||""};m[k].v+=r.valor_usd||0;});
    return Object.entries(m).sort(([,a],[,b])=>MESES.indexOf(a.mes)-MESES.indexOf(b.mes)).map(([,v])=>({l:v.mes.slice(0,3)+"/"+v.ano.slice(2),v:v.v}));
  },[fil]);

  /* Série cronológica para gráfico de linha (modo TODOS) */
  const byMonthChrono=useMemo(()=>{
    if(yr!=="TODOS") return [];
    const m={};
    fil.forEach(r=>{
      const k=r.mes_ref||"?";
      if(!m[k]) m[k]={v:0,mes:k.split(" ")[0],ano:k.split(" ")[1]||""};
      m[k].v+=r.valor_usd||0;
    });
    return Object.entries(m)
      .map(([k,v])=>({l:v.mes.slice(0,3)+"/"+v.ano.slice(2),v:v.v,ano:v.ano,mesIdx:MESES.indexOf(v.mes),full:k}))
      .sort((a,b)=>a.ano===b.ano?a.mesIdx-b.mesIdx:a.ano.localeCompare(b.ano));
  },[fil,yr]);

  const byCli=useMemo(()=>{
    const m={};fil.forEach(r=>{const c=r.cliente||"—";m[c]=(m[c]||0)+(r.valor_usd||0);});
    return Object.entries(m).sort(([,a],[,b])=>b-a).map(([l,v])=>({l,v}));
  },[fil]);

  /* Margem bruta por cliente (fat - frete) */
  const byCliMargem=useMemo(()=>{
    const mf={},mr={};
    fil.forEach(r=>{
      const c=r.cliente||"—";
      mf[c]=(mf[c]||0)+(r.valor_usd||0);
      mr[c]=(mr[c]||0)+(r.frete_usd||0);
    });
    return Object.entries(mf).sort(([,a],[,b])=>b-a).map(([l,fat])=>({
      l,
      fat,
      fret:mr[l]||0,
      margem:fat-(mr[l]||0),
      pctMargem:fat>0?((fat-(mr[l]||0))/fat*100):null
    }));
  },[fil]);

  /* Concentração rolling 12 meses — imune ao filtro yr */
  const concentracao=useMemo(()=>{
    const hoje=new Date();
    const limite=new Date(hoje.getFullYear()-1,hoje.getMonth(),1);
    const MESES_PT=["JAN","FEV","MAR","ABR","MAI","JUN","JUL","AGO","SET","OUT","NOV","DEZ"];
    const MESES_FULL=["JANEIRO","FEVEREIRO","MARÇO","ABRIL","MAIO","JUNHO","JULHO","AGOSTO","SETEMBRO","OUTUBRO","NOVEMBRO","DEZEMBRO"];

    function parseMesRef(mr){
      if(!mr) return null;
      const parts=mr.trim().split(/[\s\/\-]+/);
      if(parts.length<2) return null;
      // Tenta "MMM YYYY" ou "MMMM YYYY" ou "MM YYYY"
      let mi=-1, yi=-1;
      // Se primeiro token é numérico → formato MM/YYYY
      if(/^\d+$/.test(parts[0])){
        mi=parseInt(parts[0])-1;
        yi=parseInt(parts[1]);
      } else {
        const tok=parts[0].toUpperCase().replace(/[^A-Z]/g,"");
        mi=MESES_PT.findIndex(m=>tok.startsWith(m));
        if(mi===-1) mi=MESES_FULL.findIndex(m=>tok.startsWith(m.substring(0,3)));
        yi=parseInt(parts[1]);
      }
      if(mi<0||mi>11||isNaN(yi)) return null;
      return new Date(yi,mi,1);
    }

    const r12=recs.filter(r=>{
      const d=parseMesRef(r.mes_ref);
      return d&&d>=limite;
    });
    const tot=r12.reduce((s,r)=>s+(r.valor_usd||0),0);
    if(!tot) return [];
    const mc={};
    r12.forEach(r=>{const c=r.cliente||"—";mc[c]=(mc[c]||0)+(r.valor_usd||0);});
    return Object.entries(mc)
      .map(([c,v])=>({c,v,pct:v/tot*100}))
      .sort((a,b)=>b.pct-a.pct);
  },[recs]);

  /* Semáforo: maior concentração */
  const maxConc=concentracao.length>0?concentracao[0]:null;
  function semaforo(pct){
    if(pct>=30) return {cor:"#DC2626",bg:"#FEE2E2",label:"Crítico",icon:"⚠"};
    if(pct>=20) return {cor:"#D97706",bg:"#FEF3C7",label:"Atenção",icon:"◉"};
    return {cor:"#059669",bg:"#DCFCE7",label:"Normal",icon:"●"};
  }

  const byDst=useMemo(()=>{
    const m={};fil.forEach(r=>{const d=r.destino||"—";m[d]=(m[d]||0)+1;});
    return Object.entries(m).sort(([,a],[,b])=>b-a).map(([l,v])=>({l,v}));
  },[fil]);

  const docSt=useMemo(()=>{
    const m={COMPLETO:0,"FALTA BL":0,PENDENTE:0};
    fil.forEach(r=>{const k=r.status_doc||"PENDENTE";m[k]=(m[k]||0)+1;});
    return Object.entries(m).filter(([,v])=>v>0).map(([l,v])=>({l,v}));
  },[fil]);

  /* annual table with historical + live data */
  const annual=useMemo(()=>{
    return Object.entries(allYears).sort().map(([ano,v])=>({ano,...v}));
  },[allYears]);

  /* years available for filter — derivado diretamente de recs (já inclui históricos) */
  const allYearKeys=useMemo(()=>{
    const s=new Set(); recs.forEach(r=>{const y=r.mes_ref?.split(" ")[1];if(y)s.add(y);}); return [...s].sort();
  },[recs]);

  return <div className="page">
    <div className="ph">
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:12}}>
        <div><h2>Dashboard Geral</h2><p>Visão consolidada de exportações Salvaro</p></div>
        <select className="sel" value={yr} onChange={e=>setYr(e.target.value)}>
          <option value="TODOS">Todos os anos</option>
          {allYearKeys.map(a=><option key={a}>{a}</option>)}
        </select>
      </div>
    </div>
    <div className="kg">
      <div className="kp hi"><div className="kl">Faturamento USD</div><div className="kv tc" style={{fontSize:20}}>{fmtUSD(fat)}</div><div className="ks">{yr}</div><YoY cur={fat} prev={fatPrev}/></div>
      <div className="kp"><div className="kl">Containers</div><div className="kv">{cnt}</div><div className="ks">embarques</div><YoY cur={cnt} prev={cntPrev}/></div>
      <div className="kp"><div className="kl">Média / CNTR</div><div className="kv gc" style={{fontSize:20}}>{fmtUSD(cnt?fat/cnt:0)}</div><YoY cur={cnt?fat/cnt:0} prev={cntPrev?fatPrev/cntPrev:0}/></div>
      <div className="kp"><div className="kl">Frete Total</div><div className="kv" style={{fontSize:20}}>{fmtUSD(fret)}</div><div className="ks">{fat?((fret/fat)*100).toFixed(1)+"%":"—"} do fat.</div><YoY cur={fret} prev={fretPrev} invert={true}/></div>
      <div className="kp"><div className="kl">Clientes</div><div className="kv gr">{byCli.length}</div><div className="ks">no período</div></div>
      <div className="kp">
        <div className="kl">Margem Bruta</div>
        <div className="kv" style={{fontSize:18,color:"#059669"}}>{fmtUSD(fil.reduce((s,r)=>s+(r.valor_usd||0)-(r.frete_usd||0),0))}</div>
        <div className="ks">{fat>0?((fil.reduce((s,r)=>s+(r.valor_usd||0)-(r.frete_usd||0),0)/fat)*100).toFixed(1)+"% do fat.":"—"}</div>
      </div>
      {maxConc&&(()=>{const sm=semaforo(maxConc.pct);return(
        <div className="kp" style={{borderLeft:"3px solid "+sm.cor,background:sm.bg+"40"}}>
          <div className="kl" style={{color:sm.cor}}>{sm.icon} Concentração {sm.label}</div>
          <div className="kv" style={{fontSize:20,color:sm.cor}}>{maxConc.c}</div>
          <div className="ks" style={{color:sm.cor,fontWeight:600}}>{maxConc.pct.toFixed(1)}% dos últ. 12m</div>
        </div>
      );})()}
      <PellKpi/>
    </div>
    {yr==="TODOS" ? <>
      <div className="card mb20">
        <div className="ct">Evolução mensal do faturamento (2015 – presente)</div>
        <LineChart data={byMonthChrono} fmt={v=>"$"+Math.round(v/1000)+"k"} height={260}/>
      </div>
      <div className="g2 mb20">
        <div className="card"><div className="ct">Faturamento por Cliente</div><Bar data={byCli} color="#D97706" fmt={v=>"$"+Math.round(v/1000)+"k"} total={fat}/></div>
        <div className="card"><div className="ct">Destinos (containers)</div><Donut data={byDst}/></div>
      </div>
      <div className="g2 mb20">
        <div className="card">
          <div className="ct">Margem bruta por cliente</div>
          <div style={{marginTop:8}}>
            {byCliMargem.map((c,i)=>{
              const sm=c.pctMargem!=null?semaforo(0):null;
              return <div key={i} style={{marginBottom:10}}>
                <div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:3}}>
                  <span style={{fontWeight:500}}>{c.l}</span>
                  <span style={{color:"var(--text2)"}}>{fmtUSD(c.margem)} <span style={{color:"#059669",fontWeight:600}}>({c.pctMargem!=null?c.pctMargem.toFixed(1)+"%":"—"})</span></span>
                </div>
                <div style={{display:"flex",gap:2,height:8,borderRadius:4,overflow:"hidden"}}>
                  <div style={{width:(c.fat>0?(c.margem/c.fat*100):0)+"%",background:"#059669",transition:"width .4s"}}/>
                  <div style={{flex:1,background:"#FCA5A5"}}/>
                </div>
                <div style={{display:"flex",justifyContent:"space-between",fontSize:10,color:"var(--text3)",marginTop:2}}>
                  <span>Margem: {fmtUSD(c.margem)}</span>
                  <span>Frete: {fmtUSD(c.fret)}</span>
                </div>
              </div>;
            })}
          </div>
        </div>
        <div className="card">
          <div className="ct">Concentração de clientes — últ. 12 meses</div>
          <div style={{marginTop:8}}>
            {concentracao.map((c,i)=>{
              const sm=semaforo(c.pct);
              return <div key={i} style={{marginBottom:10}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
                  <span style={{fontSize:12,fontWeight:500}}>{c.c}</span>
                  <div style={{display:"flex",alignItems:"center",gap:6}}>
                    <span style={{fontSize:11,fontWeight:700,color:sm.cor}}>{c.pct.toFixed(1)}%</span>
                    <span style={{fontSize:10,background:sm.bg,color:sm.cor,padding:"1px 7px",borderRadius:8,fontWeight:600}}>{sm.label}</span>
                  </div>
                </div>
                <div style={{height:8,background:"var(--bg3)",borderRadius:4}}>
                  <div style={{height:8,background:sm.cor,borderRadius:4,width:Math.min(c.pct,100)+"%",transition:"width .4s"}}/>
                </div>
              </div>;
            })}
            <div style={{marginTop:12,padding:"8px 12px",background:"var(--bg3)",borderRadius:8,fontSize:11,color:"var(--text2)"}}>
              <strong>Limites:</strong> 🟢 &lt;20% normal · 🟡 20–30% atenção · 🔴 &gt;30% crítico
            </div>
          </div>
        </div>
      </div>
    </> : <>
      <div className="g2 mb20">
        <div className="card"><div className="ct">Faturamento por Mês</div><Bar data={byMonth} fmt={v=>"$"+Math.round(v/1000)+"k"}/></div>
        <div className="card"><div className="ct">Faturamento por Cliente</div><Bar data={byCli} color="#D97706" fmt={v=>"$"+Math.round(v/1000)+"k"} total={fat}/></div>
      </div>
      <div className="g2 mb20">
        <div className="card"><div className="ct">Destinos (containers)</div><Donut data={byDst}/></div>
        <div className="card"><div className="ct">Status Documentação</div><Donut data={docSt}/></div>
      </div>
    </>}

    {/* ── Margem bruta e Concentração — sempre visíveis ── */}
    <div className="g2 mb20">
      <div className="card">
        <div className="ct">Margem bruta por cliente — {yr==="TODOS"?"todos os anos":yr}</div>
        <div style={{marginTop:8}}>
          {byCliMargem.length===0
            ? <div className="empty">Sem dados</div>
            : byCliMargem.map((c,i)=>{
                const sm=semaforo(c.pctMargem!=null?0:0);
                return <div key={i} style={{marginBottom:10}}>
                  <div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:3}}>
                    <span style={{fontWeight:500}}>{c.l}</span>
                    <span style={{color:"var(--text2)"}}>{fmtUSD(c.margem)} <span style={{color:"#059669",fontWeight:600}}>({c.pctMargem!=null?c.pctMargem.toFixed(1)+"%":"—"})</span></span>
                  </div>
                  <div style={{display:"flex",gap:2,height:8,borderRadius:4,overflow:"hidden"}}>
                    <div style={{width:Math.max(0,Math.min(100,c.fat>0?c.margem/c.fat*100:0))+"%",background:"#059669",borderRadius:4,transition:"width .4s"}}/>
                    <div style={{flex:1,background:"#FCA5A5",borderRadius:4}}/>
                  </div>
                  <div style={{display:"flex",justifyContent:"space-between",fontSize:10,color:"var(--text3)",marginTop:2}}>
                    <span>Faturamento: {fmtUSD(c.fat)}</span>
                    <span style={{color:"#DC2626"}}>Frete: {fmtUSD(c.fret)}</span>
                  </div>
                </div>;
              })
          }
          {byCliMargem.length>0&&<div style={{marginTop:10,padding:"8px 12px",background:"var(--bg3)",borderRadius:8,fontSize:11,color:"var(--text2)"}}>
            <strong>Total período:</strong> Margem {fmtUSD(byCliMargem.reduce((s,c)=>s+c.margem,0))} · {fat>0?((byCliMargem.reduce((s,c)=>s+c.margem,0)/fat)*100).toFixed(1)+"% do faturamento":"—"}
          </div>}
        </div>
      </div>
      <div className="card">
        <div className="ct">Concentração por cliente — últimos 12 meses</div>
        <div style={{marginTop:8}}>
          {concentracao.length===0
            ? <div className="empty">Sem dados</div>
            : concentracao.map((c,i)=>{
                const sm=semaforo(c.pct);
                return <div key={i} style={{marginBottom:12}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
                    <span style={{fontSize:13,fontWeight:500}}>{c.c}</span>
                    <div style={{display:"flex",alignItems:"center",gap:6}}>
                      <span style={{fontSize:13,fontWeight:700,color:sm.cor}}>{c.pct.toFixed(1)}%</span>
                      <span style={{fontSize:10,background:sm.bg,color:sm.cor,padding:"2px 8px",borderRadius:8,fontWeight:600}}>{sm.icon} {sm.label}</span>
                    </div>
                  </div>
                  <div style={{height:10,background:"var(--bg3)",borderRadius:5}}>
                    <div style={{height:10,background:sm.cor,borderRadius:5,width:Math.min(c.pct,100)+"%",transition:"width .5s"}}/>
                  </div>
                  <div style={{fontSize:10,color:"var(--text3)",marginTop:2}}>{fmtUSD(c.v)}</div>
                </div>;
              })
          }
          <div style={{marginTop:8,padding:"8px 12px",background:"var(--bg3)",borderRadius:8,fontSize:11,color:"var(--text2)"}}>
            🟢 &lt;20% normal &nbsp;·&nbsp; 🟡 20–30% atenção &nbsp;·&nbsp; 🔴 &gt;30% crítico
          </div>
        </div>
      </div>
    </div>

    <div className="card">
      <div className="ct">Histórico Anual (2015 – presente)</div>
      <div className="tw"><table>
        <thead><tr><th>Ano</th><th>Faturamento</th><th>Δ YoY</th><th>Containers</th><th>Média/CNTR</th><th>Frete Total</th><th>% Frete/Fat</th></tr></thead>
        <tbody>{annual.map((r,i)=>{
          const prev = i>0 ? annual[i-1] : null;
          const yoy = prev && prev.fat>0 ? ((r.fat/prev.fat)-1)*100 : null;
          const yoyColor = yoy===null ? "var(--text3)" : yoy>=0 ? "#059669" : "#DC2626";
          const yoyStr = yoy===null ? "—" : (yoy>=0?"+":"")+yoy.toFixed(1)+"%";
          return <tr key={r.ano} style={r.ano>="2025"?{fontWeight:500}:{}}>
            <td><strong>{r.ano}</strong>{r.ano<"2025"&&<span style={{fontSize:10,color:"#94A8BA",marginLeft:6}}>hist.</span>}</td>
            <td className="r">{fmtUSD(r.fat)}</td>
            <td className="r" style={{color:yoyColor,fontWeight:500,fontSize:12}}>{yoyStr}</td>
            <td className="r">{r.cnt}</td>
            <td className="r">{fmtUSD(r.cnt?r.fat/r.cnt:0)}</td><td className="r">{fmtUSD(r.fret)}</td>
            <td className="r">{r.fat?((r.fret/r.fat)*100).toFixed(1)+"%":"—"}</td>
          </tr>;
        })}</tbody>
      </table></div>
    </div>
  </div>;
}

/* ══════════════════════════════════════════
   OPERACIONAL
══════════════════════════════════════════ */
function PgOps({recs, ant, setAnt, vig, setVig, seg, setSeg}) {
  const avail=useMemo(()=>{const s=new Set();recs.forEach(r=>{if(r.mes_ref)s.add(r.mes_ref)});return [...s].sort();},[recs]);

  function getRows(mes){ return recs.filter(r=>r.mes_ref===mes).sort((a,b)=>(a.invoice||0)-(b.invoice||0)); }

  const Sec=({title,mes,col})=>{
    const rows=getRows(mes);
    const tot=rows.reduce((s,r)=>s+(r.valor_usd||0),0);
    const today=new Date(); today.setHours(0,0,0,0);
    const in3d=new Date(today); in3d.setDate(in3d.getDate()+3);

    /* Determinar alerta para uma data */
    function dateAlert(dateStr, blockerField, rec) {
      if(!dateStr) return "missing";
      const d=new Date(dateStr+"T00:00:00");
      if(isNaN(d)) return "none";
      if(d < today) {
        /* Data vencida — vermelho se blocker ainda não preenchido */
        if(blockerField && !rec[blockerField]) return "overdue";
        if(!blockerField) return "overdue";
        return "done";
      }
      if(d <= in3d) return "soon";
      return "none";
    }

    /* Estilos por nível de alerta */
    const alertStyle = (level) => {
      switch(level) {
        case "overdue": return {background:"#FEF2F2",color:"#991B1B",fontWeight:600};
        case "soon": return {background:"#FFFBEB",color:"#92400E",fontWeight:600};
        case "missing": return {color:"#D1D5DB",fontStyle:"italic"};
        default: return {};
      }
    };

    /* Contagem de alertas */
    const alerts = rows.reduce((a,r) => {
      if(dateAlert(r.eta_pedido,null,r)==="overdue") a.overdue++;
      if(dateAlert(r.dl_carga,"booking",r)==="overdue") a.overdue++;
      if(dateAlert(r.estufagem,"container",r)==="overdue") a.overdue++;
      if(dateAlert(r.dl_carga,"booking",r)==="soon") a.soon++;
      if(dateAlert(r.estufagem,"container",r)==="soon") a.soon++;
      return a;
    },{overdue:0,soon:0});

    return <div className="card mb20">
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12,flexWrap:"wrap",gap:8}}>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <div style={{width:9,height:9,borderRadius:"50%",background:col}}/>
          <span className="ct" style={{marginBottom:0}}>{title}</span>
          <strong style={{fontSize:14,color:"var(--text)"}}>{mes}</strong>
          <span style={{color:"var(--text2)",fontSize:12}}>— {rows.length} embarques — {fmtUSD(tot)}</span>
        </div>
        <div style={{display:"flex",gap:8}}>
          {alerts.overdue>0&&<span style={{background:"#FEF2F2",color:"#991B1B",fontSize:11,fontWeight:600,padding:"3px 10px",borderRadius:12,border:"1px solid #FECACA"}}>⚠ {alerts.overdue} vencido{alerts.overdue>1?"s":""}</span>}
          {alerts.soon>0&&<span style={{background:"#FFFBEB",color:"#92400E",fontSize:11,fontWeight:600,padding:"3px 10px",borderRadius:12,border:"1px solid #FDE68A"}}>⏳ {alerts.soon} próximo{alerts.soon>1?"s":""}</span>}
        </div>
      </div>
      <div className="tw"><table className="ops-table">
        <colgroup>
          <col style={{width:"5.5%"}}/>
          <col style={{width:"10%"}}/>
          <col style={{width:"8.5%"}}/>
          <col style={{width:"6%"}}/>
          <col style={{width:"8.5%"}}/>
          <col style={{width:"5.5%"}}/>
          <col style={{width:"9.5%"}}/>
          <col style={{width:"7.5%"}}/>
          <col style={{width:"10.5%"}}/>
          <col style={{width:"10.5%"}}/>
          <col style={{width:"6%"}}/>
          <col style={{width:"6%"}}/>
          <col style={{width:"6%"}}/>
        </colgroup>
        <thead><tr><th>Invoice</th><th>Cliente</th><th>PO#</th><th>NF</th><th>Destino</th><th>ETA</th><th>Agente</th><th>Booking</th><th>Container</th><th>Navio</th><th>DL Carga</th><th>Estufagem</th><th>Transp.</th></tr></thead>
        <tbody>{rows.length===0
          ?<tr><td colSpan={13} className="empty">Nenhum embarque neste período</td></tr>
          :rows.map((r,i)=>{
            const etaLvl=dateAlert(r.eta_pedido,null,r);
            const dlLvl=dateAlert(r.dl_carga,"booking",r);
            const estLvl=dateAlert(r.estufagem,"container",r);
            const estDone = ["NO PORTO","EMBARCADO","ENTREGUE"].includes(r.status);
            return <tr key={r.invoice}>
              <td><strong>{r.invoice}</strong></td>
              <td>{r.cliente||"—"}</td><td className="m">{fmtInt(r.po)}</td><td>{fmtInt(r.nf)}</td>
              <td>{r.destino||"—"}</td>
              <td style={alertStyle(etaLvl)}>{fmtDate(r.eta_pedido)}{etaLvl==="overdue"&&" ⚠"}</td>
              <td>{r.agente?.split(" -")[0]||"—"}</td><td className="m">{fmtInt(r.booking)}</td>
              <td>{r.container||"—"}</td><td className="m">{r.navio||"—"}</td>
              <td style={alertStyle(dlLvl)}>{fmtDate(r.dl_carga)}{dlLvl==="overdue"&&" ⚠"}{dlLvl==="soon"&&" ⏳"}</td>
              <td style={estDone?{color:"#059669",fontWeight:600}:alertStyle(estLvl)}>{fmtDate(r.estufagem)}{estDone&&" ✓"}{!estDone&&estLvl==="overdue"&&" ⚠"}{!estDone&&estLvl==="soon"&&" ⏳"}</td>
              <td className="m">{r.transportadora||"—"}</td>
            </tr>;
          })
        }</tbody>
      </table></div>
    </div>;
  };

  return <div className="page">
    <div className="ph">
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:12}}>
        <div><h2>Controle Operacional</h2><p>Mês anterior, vigente e seguinte</p></div>
        <button className="btn bgx bsm" onClick={()=>exportOperacionalXLS(ant,getRows(ant),vig,getRows(vig),seg,getRows(seg))}>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Exportar Excel (3 meses)
        </button>
      </div>
    </div>
    <div className="card mb20">
      <div className="sel-grid">
        {[["Mês Anterior",ant,setAnt,"#D97706"],["Mês Vigente",vig,setVig,"#1A6DC8"],["Mês Seguinte",seg,setSeg,"#059669"]].map(([lb,val,set,col])=>(
          <div key={lb}>
            <div style={{fontSize:11,fontWeight:600,color:"var(--text2)",letterSpacing:1,textTransform:"uppercase",marginBottom:6}}>{lb}</div>
            <select className="sel" style={{width:"100%",borderColor:col+"66"}} value={val} onChange={e=>set(e.target.value)}>
              {avail.map(m=><option key={m}>{m}</option>)}
            </select>
          </div>
        ))}
      </div>
    </div>
    <Sec title="MÊS ANTERIOR" mes={ant} col="#D97706"/>
    <Sec title="MÊS VIGENTE"  mes={vig} col="#1A6DC8"/>
    <Sec title="MÊS SEGUINTE" mes={seg} col="#059669"/>
  </div>;
}

/* ══════════════════════════════════════════
   CARTEIRA — BI Dashboard para diretoria
══════════════════════════════════════════ */
function PgCart({recs, m1, m2, m3}) {
  const [expanded,setExpanded]=useState(null); /* which month is expanded */

  function getCartRows(mes){ return recs.filter(r=>r.mes_ref===mes).sort((a,b)=>(a.invoice||0)-(b.invoice||0)); }

  /* Dados agregados dos 3 meses */
  const months = useMemo(()=>{
    return [
      {key:"m1",label:m1,color:"#D97706",rows:getCartRows(m1)},
      {key:"m2",label:m2,color:"#1A6DC8",rows:getCartRows(m2)},
      {key:"m3",label:m3,color:"#059669",rows:getCartRows(m3)},
    ].map(m=>({
      ...m,
      cnt:m.rows.length,
      fat:m.rows.reduce((s,r)=>s+(r.valor_usd||0),0),
      byCli:(()=>{const c={};m.rows.forEach(r=>{const k=r.cliente||"—";c[k]=(c[k]||0)+(r.valor_usd||0)});return Object.entries(c).sort(([,a],[,b])=>b-a).map(([l,v])=>({l,v}));})(),
      byDst:(()=>{const d={};m.rows.forEach(r=>{const k=r.destino||"—";d[k]=(d[k]||0)+1});return Object.entries(d).sort(([,a],[,b])=>b-a).map(([l,v])=>({l,v}));})(),
    }));
  },[recs,m1,m2,m3]);

  const totalFat = months.reduce((s,m)=>s+m.fat,0);
  const totalCnt = months.reduce((s,m)=>s+m.cnt,0);

  /* ── Mini bar chart SVG (horizontal, 3 barras) ── */
  const BarCompare = ({data, fmt, label}) => {
    const max = Math.max(...data.map(d=>d.v),1);
    return <div>
      <div style={{fontSize:10,fontWeight:600,color:"var(--text3)",letterSpacing:.5,textTransform:"uppercase",marginBottom:8}}>{label}</div>
      {data.map((d,i)=>(
        <div key={i} style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
          <div style={{width:8,height:8,borderRadius:"50%",background:d.c,flexShrink:0}}/>
          <div style={{width:50,fontSize:11,color:"var(--text2)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{d.l}</div>
          <div style={{flex:1,height:6,background:"#EEF2F6",borderRadius:3,overflow:"hidden"}}>
            <div style={{width:`${(d.v/max)*100}%`,height:"100%",background:d.c,borderRadius:3,transition:"width .4s"}}/>
          </div>
          <div style={{fontSize:11,fontWeight:600,color:"var(--text)",minWidth:60,textAlign:"right"}}>{fmt(d.v)}</div>
        </div>
      ))}
    </div>;
  };

  /* ── Donut simples (clientes ou destinos) ── */
  const MiniDonut = ({data, color}) => {
    const total=data.reduce((s,d)=>s+d.v,0);
    if(!total) return null;
    const r=28,cx=35,cy=35,circ=2*Math.PI*r;
    const COLS=["#1A6DC8","#D97706","#059669","#EA580C","#7C3AED","#DC2626","#DB2777","#0891B2"];
    let off=0;
    const segs=data.slice(0,6).map((d,i)=>{const pct=d.v/total,dash=pct*circ,seg={...d,dash,off:off*circ,c:COLS[i%COLS.length]};off+=pct;return seg;});
    return <div style={{display:"flex",alignItems:"center",gap:10}}>
      <svg width="70" height="70" viewBox="0 0 70 70" style={{flexShrink:0}}>
        <circle cx={cx} cy={cy} r={r} fill="none" stroke="#EEF2F6" strokeWidth="10"/>
        {segs.map((s,i)=><circle key={i} cx={cx} cy={cy} r={r} fill="none" stroke={s.c} strokeWidth="10"
          strokeDasharray={`${s.dash} ${circ-s.dash}`} strokeDashoffset={circ/4-s.off}/>)}
        <text x={cx} y={cy+4} textAnchor="middle" fill="var(--text)" fontSize="11" fontWeight="700" fontFamily="Syne">{total}</text>
      </svg>
      <div style={{display:"flex",flexDirection:"column",gap:4}}>
        {segs.map((s,i)=><div key={i} style={{display:"flex",alignItems:"center",gap:5,fontSize:10}}>
          <div style={{width:7,height:7,borderRadius:"50%",background:s.c,flexShrink:0}}/>
          <span style={{color:"var(--text2)"}}>{s.l}</span>
          <span style={{marginLeft:"auto",fontWeight:600,color:"var(--text)",paddingLeft:6}}>{s.v}</span>
        </div>)}
      </div>
    </div>;
  };

  /* ── Card de mês (colapsável) ── */
  const MesCard = ({m, idx}) => {
    const isOpen = expanded === idx;
    const avg = m.cnt ? m.fat / m.cnt : 0;
    const pctTotal = totalFat ? (m.fat / totalFat * 100) : 0;
    return <div className="card" style={{border:isOpen?`2px solid ${m.color}`:"1px solid var(--border)",transition:"border .2s"}}>
      {/* Header com KPIs inline */}
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",cursor:"pointer",marginBottom:isOpen?12:0}} onClick={()=>setExpanded(isOpen?null:idx)}>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <div style={{width:10,height:10,borderRadius:"50%",background:m.color,flexShrink:0}}/>
          <strong style={{fontSize:14,color:"var(--text)"}}>{m.label}</strong>
          <span style={{fontSize:11,color:"var(--text3)",marginLeft:4}}>{m.cnt} pedidos</span>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:16}}>
          <div style={{textAlign:"right"}}>
            <div style={{fontFamily:"Syne",fontSize:16,fontWeight:700,color:m.color}}>{fmtUSD(m.fat)}</div>
            <div style={{fontSize:10,color:"var(--text3)"}}>{pctTotal.toFixed(1)}% da carteira</div>
          </div>
          <div style={{fontSize:16,color:"var(--text3)",transition:"transform .2s",transform:isOpen?"rotate(180deg)":"rotate(0deg)"}}>▾</div>
        </div>
      </div>

      {/* Conteúdo expandido */}
      {isOpen && <>
        {/* KPIs do mês */}
        <div className="kpi-grid4" style={{padding:"10px 0",borderTop:"1px solid var(--border)",borderBottom:"1px solid var(--border)",marginBottom:14}}>
          <div><div style={{fontSize:10,color:"var(--text3)",fontWeight:600,letterSpacing:.4,textTransform:"uppercase"}}>Pedidos</div><div style={{fontFamily:"Syne",fontSize:18,fontWeight:700,color:"var(--text)"}}>{m.cnt}</div></div>
          <div><div style={{fontSize:10,color:"var(--text3)",fontWeight:600,letterSpacing:.4,textTransform:"uppercase"}}>Faturamento</div><div style={{fontFamily:"Syne",fontSize:14,fontWeight:700,color:m.color}}>{fmtUSD(m.fat)}</div></div>
          <div><div style={{fontSize:10,color:"var(--text3)",fontWeight:600,letterSpacing:.4,textTransform:"uppercase"}}>Média/CNTR</div><div style={{fontFamily:"Syne",fontSize:14,fontWeight:700,color:"var(--text)"}}>{fmtUSD(avg)}</div></div>
          <div><div style={{fontSize:10,color:"var(--text3)",fontWeight:600,letterSpacing:.4,textTransform:"uppercase"}}>% Carteira</div><div style={{fontFamily:"Syne",fontSize:14,fontWeight:700,color:"var(--text)"}}>{pctTotal.toFixed(1)}%</div></div>
        </div>

        {/* Gráficos: clientes + destinos lado a lado */}
        <div className="g2" style={{marginBottom:14}}>
          <div>
            <div style={{fontSize:10,fontWeight:600,color:"var(--text3)",letterSpacing:.5,textTransform:"uppercase",marginBottom:6}}>Por Cliente</div>
            {m.byCli.map((c,i)=>(
              <div key={i} style={{display:"flex",alignItems:"center",gap:6,marginBottom:4}}>
                <div style={{width:50,fontSize:11,color:"var(--text2)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{c.l}</div>
                <div style={{flex:1,height:5,background:"#EEF2F6",borderRadius:3,overflow:"hidden"}}><div style={{width:`${(c.v/m.fat)*100}%`,height:"100%",background:m.color,borderRadius:3}}/></div>
                <div style={{fontSize:10,fontWeight:600,color:"var(--text)",minWidth:40,textAlign:"right"}}>{(c.v/m.fat*100).toFixed(0)}%</div>
              </div>
            ))}
          </div>
          <div>
            <div style={{fontSize:10,fontWeight:600,color:"var(--text3)",letterSpacing:.5,textTransform:"uppercase",marginBottom:6}}>Destinos</div>
            <MiniDonut data={m.byDst}/>
          </div>
        </div>

        {/* Tabela de pedidos */}
        <div className="tw" style={{borderRadius:8}}>
          <table className="cart-table">
            <thead><tr>
              <th>Invoice</th><th>Cliente</th><th>PO#</th><th>Destino</th>
              <th style={{textAlign:"right"}}>Valor USD</th><th>ETA</th><th>Status</th>
            </tr></thead>
            <tbody>{m.rows.map(r=>(
              <tr key={r.invoice}>
                <td><strong style={{color:m.color}}>{r.invoice}</strong></td>
                <td style={{color:"var(--text2)"}}>{r.cliente||"—"}</td>
                <td style={{color:"var(--text2)"}}>{fmtInt(r.po)}</td>
                <td>{r.destino||"—"}</td>
                <td style={{textAlign:"right",fontVariantNumeric:"tabular-nums",fontWeight:500}}>{fmtUSD(r.valor_usd)}</td>
                <td style={{color:"var(--text2)"}}>{fmtDate(r.eta_pedido)}</td>
                <td><EmbBadge v={r.status}/></td>
              </tr>
            ))}</tbody>
          </table>
        </div>
      </>}
    </div>;
  };

  return <div className="page">
    <div className="ph">
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:12}}>
        <div><h2>Carteira de Pedidos</h2><p>Programação de embarques por período</p></div>
        <button className="btn bgx bsm" onClick={()=>exportCarteiraXLS(m1,getCartRows(m1),m2,getCartRows(m2),m3,getCartRows(m3))}>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Exportar Excel
        </button>
      </div>
    </div>

    {/* Período automático: mês vigente + 2 próximos */}

    {/* KPIs consolidados — visão rápida dos 3 meses */}
    <div className="kpi-grid4" style={{marginBottom:16}}>
      <div className="kp hi"><div className="kl">Total Carteira</div><div className="kv tc" style={{fontSize:18}}>{fmtUSD(totalFat)}</div><div className="ks">{totalCnt} containers em 3 meses</div></div>
      {months.map((m,i)=>(
        <div key={i} className="kp"><div className="kl" style={{color:m.color}}>{m.label.split(" ")[0]}/{m.label.split(" ")[1]?.slice(2)}</div><div className="kv" style={{fontSize:16,color:m.color}}>{fmtUSD(m.fat)}</div><div className="ks">{m.cnt} pedidos</div></div>
      ))}
    </div>

    {/* Gráfico comparativo: faturamento + containers dos 3 meses */}
    <div className="g2 mb20">
      <div className="card">
        <BarCompare label="Faturamento por Mês" data={months.map(m=>({l:m.label.split(" ")[0],v:m.fat,c:m.color}))} fmt={v=>"$"+Math.round(v/1000)+"k"}/>
      </div>
      <div className="card">
        <BarCompare label="Containers por Mês" data={months.map(m=>({l:m.label.split(" ")[0],v:m.cnt,c:m.color}))} fmt={v=>v+" CNTR"}/>
      </div>
    </div>

    {/* Cards dos 3 meses — colapsáveis */}
    <div style={{display:"flex",flexDirection:"column",gap:12}}>
      {months.map((m,i)=> <MesCard key={i} m={m} idx={i}/> )}
    </div>
  </div>;
}

/* ══════════════════════════════════════════
   SHIPPING REPORT — Controle de embarques
══════════════════════════════════════════ */
const SHIP_STATUS_MAP = {"EMBARCADO":"ON BOARD","AGD ESTUFAGEM":"READY TO LOAD","NO PORTO":"AT PORT","EM PRODUÇÃO":"PENDING","CARTEIRA":"PENDING"};
const SHIP_STATUS_COLORS = {
  "ON BOARD":     {bg:"#DBEAFE",color:"#1E40AF",border:"#BFDBFE",icon:"🚢"},
  "READY TO LOAD":{bg:"#FEF3C7",color:"#92400E",border:"#FDE68A",icon:"📦"},
  "AT PORT":      {bg:"#D1FAE5",color:"#065F46",border:"#A7F3D0",icon:"⚓"},
  "PENDING":      {bg:"#F3F4F6",color:"#6B7280",border:"#E5E7EB",icon:"⏳"},
};

/* Status badge styles for Excel */
const SHIP_XL_STATUS = {
  "ON BOARD":      {font:{name:"Calibri",sz:9,bold:true,color:{rgb:"1A5E38"}},fill:{fgColor:{rgb:"D6F4E3"}},alignment:{horizontal:"center",vertical:"center"}},
  "READY TO LOAD": {font:{name:"Calibri",sz:9,bold:true,color:{rgb:"7A5100"}},fill:{fgColor:{rgb:"FFF3CD"}},alignment:{horizontal:"center",vertical:"center"}},
  "AT PORT":       {font:{name:"Calibri",sz:9,bold:true,color:{rgb:"1E40AF"}},fill:{fgColor:{rgb:"DBEAFE"}},alignment:{horizontal:"center",vertical:"center"}},
  "PENDING":       {font:{name:"Calibri",sz:9,bold:true,color:{rgb:"505A72"}},fill:{fgColor:{rgb:"ECEEF3"}},alignment:{horizontal:"center",vertical:"center"}},
};

function fmtDateUS(d) {
  if(!d) return "";
  const dt = new Date(d+"T00:00:00");
  if(isNaN(dt)) return "";
  return String(dt.getMonth()+1).padStart(2,"0")+"/"+String(dt.getDate()).padStart(2,"0")+"/"+dt.getFullYear();
}

function exportShipXLS(cliente, rows) {
  const now = new Date();
  const weekNum = Math.ceil(((now - new Date(now.getFullYear(),0,1))/86400000 + new Date(now.getFullYear(),0,1).getDay()+1)/7);
  const fileName = `WEEKLY_SHIPPING_REPORT_-_${cliente}_W${weekNum}_${now.getFullYear()}.xlsx`;

  const aoa = [];
  const COLS = 9; /* B-J mapped to 0-8 in aoa, col A is spacer */

  /* Row 0 (spacer) */
  aoa.push(["",""]);
  /* Row 1: SALVARO INDUSTRIAL */
  aoa.push(["","SALVARO INDUSTRIAL","","","","","","","",""]);
  /* Row 2: Weekly Shipping Report */
  aoa.push(["","Weekly Shipping Report","","","","","","","",""]);
  /* Row 3 (spacer) */
  aoa.push(["",""]);
  /* Row 4: Client name */
  aoa.push(["",cliente,"","","","","","","",""]);
  /* Row 5: Headers */
  aoa.push(["","INVOICE","PO #","VESSEL","ETD","ETA","CONTAINER","BL #","STATUS",""]);

  /* Data rows */
  rows.forEach(r => {
    aoa.push([
      "",
      r.invoice||"",
      fmtInt(r.po),
      r.navio||"",
      fmtDateUS(r.etd),
      fmtDateUS(r.eta),
      r.container||"",
      r.bl ? fmtDateUS(r.bl) : "",
      r._shipSt||"PENDING",
      ""
    ]);
  });

  /* Spacer + footer */
  aoa.push(["",""]);
  const footerRow = aoa.length;
  aoa.push(["",`Salvaro Industrial  ·  Weekly Shipping Report  ·  W${weekNum} ${now.getFullYear()}  ·  Confidential`,"","","","","","","",""]);

  const ws = XLSX.utils.aoa_to_sheet(aoa);

  /* ── STYLES ── */
  const darkBg  = {fgColor:{rgb:"0D1C3F"}};
  const whiteFc = {name:"Calibri",sz:10,color:{rgb:"FFFFFF"}};
  const dataFc  = {name:"Calibri",sz:10,color:{rgb:"1A1A2E"}};
  const rowWhite = {font:dataFc, alignment:{vertical:"center"}, fill:{fgColor:{rgb:"FFFFFF"}}};
  const rowZebra = {font:dataFc, alignment:{vertical:"center"}, fill:{fgColor:{rgb:"F4F6FA"}}};
  const centStyle = (base) => ({...base, alignment:{...base.alignment, horizontal:"center"}});
  const leftStyle = (base) => ({...base, alignment:{...base.alignment, horizontal:"left"}});

  /* Row 1: title */
  for(let c=0;c<=9;c++) applyStyle(ws, XLSX.utils.encode_cell({r:1,c}), {font:{name:"Calibri",sz:16,bold:true,color:{rgb:"0D1C3F"}},alignment:{horizontal:"left",vertical:"center"}});
  /* Row 2: subtitle */
  for(let c=0;c<=9;c++) applyStyle(ws, XLSX.utils.encode_cell({r:2,c}), {font:{name:"Calibri",sz:10,color:{rgb:"5B9E3A"}},alignment:{horizontal:"left",vertical:"center"}});
  /* Row 4: client name */
  for(let c=0;c<=9;c++) applyStyle(ws, XLSX.utils.encode_cell({r:4,c}), {font:{name:"Calibri",sz:14,bold:true,color:{rgb:"FFFFFF"}},fill:darkBg,alignment:{horizontal:"left",vertical:"center"}});
  /* Row 5: headers */
  for(let c=0;c<=9;c++) applyStyle(ws, XLSX.utils.encode_cell({r:5,c}), {font:{name:"Calibri",sz:10,bold:true,color:{rgb:"FFFFFF"}},fill:darkBg,alignment:{horizontal:"center",vertical:"center"}});

  /* Data rows */
  for(let r=6;r<6+rows.length;r++){
    const isZebra = (r-6)%2===1;
    const base = isZebra ? rowZebra : rowWhite;
    for(let c=0;c<=9;c++){
      /* Column alignment: B=center, C-D=left, E-F=center, G-H=left, I=status, J=left */
      let style;
      if(c===1) style = centStyle(base);       /* INVOICE */
      else if(c===4||c===5) style = centStyle(base); /* ETD, ETA */
      else if(c===8) {
        /* STATUS badge */
        const statusVal = ws[XLSX.utils.encode_cell({r,c})]?.v || "PENDING";
        style = SHIP_XL_STATUS[statusVal] || SHIP_XL_STATUS.PENDING;
      }
      else style = leftStyle(base);
      applyStyle(ws, XLSX.utils.encode_cell({r,c}), style);
    }
  }

  /* Footer */
  for(let c=0;c<=9;c++) applyStyle(ws, XLSX.utils.encode_cell({r:footerRow,c}), {font:{name:"Calibri",sz:9,color:{rgb:"8891A8"}},fill:{fgColor:{rgb:"F0F2F6"}},alignment:{horizontal:"right",vertical:"center"}});

  /* Merges */
  ws["!merges"] = [
    {s:{r:1,c:1},e:{r:1,c:9}},  /* Title */
    {s:{r:2,c:1},e:{r:2,c:9}},  /* Subtitle */
    {s:{r:4,c:1},e:{r:4,c:9}},  /* Client */
    {s:{r:footerRow,c:1},e:{r:footerRow,c:9}}, /* Footer */
  ];

  /* Column widths matching reference */
  ws["!cols"] = [
    {wch:2.8},{wch:14.8},{wch:16.8},{wch:26.8},{wch:13.8},{wch:13.8},{wch:18.8},{wch:18.8},{wch:18.8},{wch:30.8}
  ];

  /* Row heights */
  ws["!rows"] = [
    {hpx:8},{hpx:26},{hpx:18},{hpx:8},{hpx:26},{hpx:22},
  ];
  for(let r=6;r<6+rows.length;r++) { if(!ws["!rows"][r]) ws["!rows"][r]={}; ws["!rows"][r].hpx=18; }
  ws["!rows"][6+rows.length] = {hpx:8};
  ws["!rows"][footerRow] = {hpx:16};

  /* Page setup */
  ws["!pageSetup"] = {orientation:"landscape",paperSize:9,fitToWidth:1,fitToHeight:0,fitToPage:true};
  ws["!printOptions"] = {gridLines:false};
  ws["!margins"] = {left:0.4,right:0.4,top:0.5,bottom:0.4,header:0.2,footer:0.2};

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Plan1");
  XLSX.writeFile(wb, fileName);
}

function PgShip({recs:allRecs}) {
  const [fCli,setFCli]=useState("");
  const [fSt,setFSt]=useState("");

  /* Apenas registros live com PO, exceto ENTREGUE */
  const shipRecs = useMemo(()=>{
    return allRecs.filter(r=>!r._hist && r.po && r.status!=="ENTREGUE").map(r=>{
      const shipSt = SHIP_STATUS_MAP[r.status] || (r.status ? "ON BOARD" : "PENDING");
      return {...r, _shipSt:shipSt};
    }).sort((a,b)=>(a.invoice||0)-(b.invoice||0));
  },[allRecs]);

  /* Filtros */
  const clientes = useMemo(()=>[...new Set(shipRecs.map(r=>r.cliente).filter(Boolean))].sort(),[shipRecs]);
  const filtered = useMemo(()=>{
    return shipRecs.filter(r=>{
      if(fCli && r.cliente!==fCli) return false;
      if(fSt && r._shipSt!==fSt) return false;
      return true;
    });
  },[shipRecs,fCli,fSt]);

  /* KPIs por status */
  const kpis = useMemo(()=>{
    const m = {"ON BOARD":0,"READY TO LOAD":0,"AT PORT":0,"PENDING":0};
    shipRecs.forEach(r=>{ m[r._shipSt]=(m[r._shipSt]||0)+1; });
    return m;
  },[shipRecs]);

  /* Progress bar */
  const ShipProgress = ({r}) => {
    const steps = ["PENDING","READY TO LOAD","AT PORT","ON BOARD"];
    const idx = steps.indexOf(r._shipSt);
    const pct = idx < 0 ? 0 : ((idx+1)/steps.length)*100;
    const sc = SHIP_STATUS_COLORS[r._shipSt]||SHIP_STATUS_COLORS.PENDING;
    return <div style={{display:"flex",alignItems:"center",gap:6,minWidth:100}}>
      <div style={{flex:1,height:5,background:"#EEF2F6",borderRadius:3,overflow:"hidden"}}>
        <div style={{width:`${pct}%`,height:"100%",background:sc.color,borderRadius:3,transition:"width .4s"}}/>
      </div>
      <span style={{fontSize:10,color:sc.color,fontWeight:600}}>{Math.round(pct)}%</span>
    </div>;
  };

  return <div className="page">
    <div className="ph">
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:12}}>
        <div><h2>Shipping Report</h2><p>Controle de embarques — atualização semanal para clientes</p></div>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <select className="sel" value={fCli} onChange={e=>setFCli(e.target.value)} style={{minWidth:140,fontSize:12}}>
            <option value="">Todos</option>
            {clientes.map(c=><option key={c}>{c}</option>)}
          </select>
          {fCli && <button className="btn bgx bsm" onClick={()=>exportShipXLS(fCli, shipRecs.filter(r=>r.cliente===fCli))}>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Export {fCli}
          </button>}
        </div>
      </div>
    </div>

    {/* KPIs */}
    <div className="kpi-grid4" style={{marginBottom:16}}>
      <div className="kp hi"><div className="kl">Total Pipeline</div><div className="kv tc" style={{fontSize:22}}>{shipRecs.length}</div><div className="ks">pedidos ativos</div></div>
      {Object.entries(SHIP_STATUS_COLORS).map(([st,sc])=>(
        <div key={st} className="kp" style={{borderLeft:`3px solid ${sc.border}`}}>
          <div className="kl">{sc.icon} {st}</div>
          <div className="kv" style={{fontSize:20}}>{kpis[st]||0}</div>
          <div className="ks">{st==="ON BOARD"?"Em trânsito":st==="READY TO LOAD"?"Aguardando embarque":st==="AT PORT"?"No porto":"Sem navio"}</div>
        </div>
      ))}
    </div>

    {/* Filtros */}
    <div className="card mb20">
