const PELL_CLR={"CARTEIRA":"bgcart","EM PRODUÇÃO":"bgprod","AGD ESTUFAGEM":"bgy","NO PORTO":"bgo","EMBARCADO":"bgb","ENTREGUE":"bge","SINISTRO":"bgr","CANCELADO":"bgr"};


/* ── SEÇÃO PAGAMENTOS (inline no modal) ─── */
function PagamentosSection({invoiceId,valorTotal,condPgto,etdPrevisto,notify}){
  const [pgts,setPgts]=useState([]);
  const [loading,setLoading]=useState(false);
  const [saving,setSaving]=useState(null);
  const [etdEfetivo,setEtdEfetivo]=useState(etdPrevisto||null);

  async function load(){
    setLoading(true);
    const {data}=await db.from("pellets_pagamentos").select("*").eq("pellet_id",invoiceId).order("ordem");
    setPgts(data||[]);
    setLoading(false);
  }

  // Se invoice não tem ETD, busca o menor ETD entre os bookings
  useEffect(()=>{
    if(etdPrevisto){setEtdEfetivo(etdPrevisto);return;}
    if(!invoiceId) return;
    db.from("pellets_bookings")
      .select("etd")
      .eq("pellet_id",invoiceId)
      .not("etd","is",null)
      .order("etd",{ascending:true})
      .limit(1)
      .then(({data})=>{
        if(data&&data.length>0) setEtdEfetivo(data[0].etd);
      });
  },[invoiceId,etdPrevisto]);

  useEffect(()=>{if(invoiceId)load();},[invoiceId]);

  async function gerarParcelas(){
    const vt=parseFloat(valorTotal)||0;
    const cond=(condPgto||"").trim();
    const etd=etdEfetivo||null;
    if(!cond){notify("Defina a condição de pagamento nos Dados Gerais","err");return;}
    if(!vt){notify("Defina o Valor EUR nos Dados Gerais","err");return;}
    if(!etd){notify("Defina o ETD no invoice ou em pelo menos um booking","err");return;}
    if(pgts.length>0&&!confirm("Substituir parcelas existentes?"))return;
    let rows=[];
    if(cond==="100% antecipado"){
      rows=[{pellet_id:invoiceId,ordem:1,descricao:"Pagamento antecipado (100%)",pct_valor:100,vl_previsto:vt,dt_prevista:etd,recebido:false,dt_recebimento:null}];
    } else {
      const m=cond.match(/^(\d+)\/(\d+)$/);
      if(!m){notify("Formato inválido. Use: 80/20 ou 100% antecipado","err");return;}
      const p1=parseInt(m[1]),p2=parseInt(m[2]);
      rows=[
        {pellet_id:invoiceId,ordem:1,descricao:`Antecipado (${p1}%)`,pct_valor:p1,vl_previsto:parseFloat((vt*p1/100).toFixed(2)),dt_prevista:etd,recebido:false,dt_recebimento:null},
        {pellet_id:invoiceId,ordem:2,descricao:`Pós-embarque (${p2}%)`,pct_valor:p2,vl_previsto:parseFloat((vt*p2/100).toFixed(2)),dt_prevista:etd,recebido:false,dt_recebimento:null}
      ];
    }
    await db.from("pellets_pagamentos").delete().eq("pellet_id",invoiceId);
    const {error}=await db.from("pellets_pagamentos").insert(rows);
    if(error){notify("Erro: "+error.message,"err");return;}
    await load();notify("Parcelas geradas!");
  }

  async function toggleRecebido(p){
    setSaving(p.id);
    const agora=new Date().toISOString().slice(0,10);
    const novo=!p.recebido;
    await db.from("pellets_pagamentos").update({recebido:novo,dt_recebimento:novo?agora:null}).eq("id",p.id);
    setSaving(null);await load();notify(novo?"✓ Recebimento confirmado":"Desmarcado");
  }

  async function updateDt(id,dt){
    await db.from("pellets_pagamentos").update({dt_prevista:dt||null}).eq("id",id);
    await load();
  }

  const hoje=new Date().toISOString().slice(0,10);
  const totalRec=pgts.filter(p=>p.recebido).reduce((s,p)=>s+(p.vl_previsto||0),0);
  const totalPend=pgts.filter(p=>!p.recebido).reduce((s,p)=>s+(p.vl_previsto||0),0);

  function stParcela(p){
    if(p.recebido) return {label:"Recebido",bg:"#DCFCE7",color:"#059669"};
    if(!p.dt_prevista) return {label:"Sem data",bg:"var(--bg3)",color:"var(--text3)"};
    if(p.dt_prevista<hoje) return {label:"Vencido",bg:"#FEE2E2",color:"#DC2626"};
    if(p.dt_prevista===hoje) return {label:"Vence hoje",bg:"#FEF3C7",color:"#D97706"};
    return {label:"A vencer",bg:"var(--blue3)",color:"var(--blue)"};
  }

  return <div style={{marginTop:4}}>
    {/* Resumo */}
    {pgts.length>0&&<div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:12}}>
      {[
        {l:"Total",v:fmtEUR2(parseFloat(valorTotal)||0),c:"#7C3AED"},
        {l:"Recebido",v:fmtEUR2(totalRec),c:"#059669"},
        {l:"Pendente",v:fmtEUR2(totalPend),c:totalPend>0?"#D97706":"#059669"},
      ].map((k,i)=><div key={i} style={{background:"var(--bg3)",borderRadius:8,padding:"8px 12px",borderLeft:`3px solid ${k.c}`}}>
        <div style={{fontSize:10,color:"var(--text2)",marginBottom:2}}>{k.l}</div>
        <div style={{fontFamily:"Syne",fontSize:15,fontWeight:700,color:k.c}}>{k.v}</div>
      </div>)}
    </div>}

    {/* Gerar / lista */}
    {pgts.length===0
      ? <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"12px 14px",background:"var(--bg3)",borderRadius:8,gap:12}}>
          <div style={{fontSize:12,color:"var(--text2)"}}>
            Condição: <strong>{condPgto||"não definida"}</strong> · ETD: <strong>{etdEfetivo?fmtDate(etdEfetivo):<span style={{color:"#DC2626"}}>não definido</span>}</strong>
            {etdEfetivo&&!etdPrevisto&&<span style={{fontSize:10,color:"var(--text3)",marginLeft:4}}>(do booking)</span>}
          </div>
          <button className="btn bgx bsm" onClick={gerarParcelas}>⚡ Gerar parcelas</button>
        </div>
      : <>
          {pgts.map(p=>{
            const st=stParcela(p);
            return <div key={p.id} style={{display:"grid",gridTemplateColumns:"1fr 150px 120px 100px auto",gap:8,alignItems:"center",padding:"10px 12px",background:"var(--bg3)",borderRadius:8,marginBottom:6,borderLeft:`3px solid ${st.color}`}}>
              <div>
                <div style={{fontWeight:500,fontSize:13}}>{p.descricao}</div>
                <div style={{fontSize:11,color:"var(--text2)"}}>{p.pct_valor}% · {fmtEUR2(p.vl_previsto)}</div>
              </div>
              <div>
                <div style={{fontSize:10,color:"var(--text3)",marginBottom:2}}>Data prevista</div>
                <input type="date" value={p.dt_prevista||""} style={{fontSize:11,padding:"4px 6px",border:"1px solid var(--border)",borderRadius:6,width:"100%",background:"var(--bg2)"}}
                  onChange={e=>updateDt(p.id,e.target.value)}/>
              </div>
              <div><span style={{...st,padding:"3px 8px",borderRadius:10,fontSize:11,fontWeight:600}}>{st.label}</span>
                {p.dt_recebimento&&<div style={{fontSize:10,color:"var(--text3)",marginTop:2}}>{fmtDate(p.dt_recebimento)}</div>}
              </div>
              <div style={{fontFamily:"Syne",fontWeight:700,fontSize:13,color:"#7C3AED",textAlign:"right"}}>{fmtEUR2(p.vl_previsto)}</div>
              <button className="btn bsm" style={{background:p.recebido?"#FEE2E2":"#DCFCE7",color:p.recebido?"#DC2626":"#059669",border:`1px solid ${p.recebido?"#FCA5A5":"#86EFAC"}`,fontWeight:600,fontSize:11,whiteSpace:"nowrap"}}
                onClick={()=>toggleRecebido(p)} disabled={saving===p.id}>
                {saving===p.id?"...":p.recebido?"✕ Desmarcar":"✓ Recebido"}
              </button>
            </div>;
          })}
          <div style={{marginTop:6,textAlign:"right"}}>
            <button className="btn bsm bg2" style={{fontSize:11}} onClick={gerarParcelas}>↺ Regenerar parcelas</button>
          </div>
        </>}
  </div>;
}

/* ── SEÇÃO BOOKINGS (inline no modal, expansível) ─── */
function BookingsSection({invoiceId,invoice,notify}){
  const [books,setBooks]=useState([]);
  const [loading,setLoading]=useState(false);
  const [saving,setSaving]=useState(false);
  const [expanded,setExpanded]=useState({}); // bookingId → bool
  const [editId,setEditId]=useState(null);
  const [addingCont,setAddingCont]=useState(null); // bookingId que está adicionando container
  const [savingCont,setSavingCont]=useState(false);

  const BE0={booking:"",ref_agente:"",navio:"",etd:"",eta:"",bl:""};
  const [bform,setBform]=useState(BE0);
  const bu=(k,v)=>setBform(f=>({...f,[k]:v}));

  const CE0={container:"",nf:"",numero:"",peso_ton:"",lacre:"",estufagem:""};
  const [cform,setCform]=useState(CE0);
  const [editContIdx,setEditContIdx]=useState(null);
  const cu=(k,v)=>setCform(f=>({...f,[k]:v}));

  async function load(){
    setLoading(true);
    const {data}=await db.from("pellets_bookings")
      .select("*,pellets_containers(*)")
      .eq("pellet_id",invoiceId)
      .order("created_at");
    setBooks(data||[]);
    // Auto-expand if only 1 booking
    if(data&&data.length===1) setExpanded(e=>({...e,[data[0].id]:true}));
    setLoading(false);
  }
  useEffect(()=>{if(invoiceId)load();},[invoiceId]);

  async function saveBook(){
    if(!bform.booking){notify("Número do booking obrigatório","err");return;}
    setSaving(true);
    const payload={pellet_id:invoiceId,booking:bform.booking,ref_agente:bform.ref_agente||null,
      navio:bform.navio||null,
      etd:bform.etd||null,eta:bform.eta||null,bl:bform.bl||null};
    let error;
    if(editId)({error}=await db.from("pellets_bookings").update(payload).eq("id",editId));
    else({error}=await db.from("pellets_bookings").insert(payload));
    setSaving(false);
    if(error){notify("Erro: "+error.message,"err");return;}
    setBform(BE0);setEditId(null);
    await load();notify("Booking salvo");
  }

  async function removeBook(id){
    if(!confirm("Remover este booking e todos os containers?"))return;
    await db.from("pellets_bookings").delete().eq("id",id);
    await load();notify("Booking removido");
  }

  async function saveCont(bookingId){
    if(!cform.container){notify("Container obrigatório","err");return;}
    setSavingCont(true);
    const bk=books.find(b=>b.id===bookingId);
    const p={booking_id:bookingId,container:cform.container,nf:cform.nf||null,
      numero:parseInt(cform.numero)||null,peso_ton:parseFloat(cform.peso_ton)||null,
      lacre:cform.lacre||null,estufagem:cform.estufagem||null};
    let error;
    if(editContIdx!==null){
      const contId=(bk?.pellets_containers||[])[editContIdx]?.id;
      if(contId)({error}=await db.from("pellets_containers").update(p).eq("id",contId));
    } else {
      ({error}=await db.from("pellets_containers").insert(p));
    }
    setSavingCont(false);
    if(error){notify("Erro: "+error.message,"err");return;}
    setCform(CE0);setEditContIdx(null);setAddingCont(null);
    await load();notify("Container salvo");
    // keep expanded state
  }

  async function removeCont(id){
    if(!confirm("Remover container?"))return;
    await db.from("pellets_containers").delete().eq("id",id);
    await load();notify("Container removido");
  }

  const totalConts=books.reduce((s,b)=>s+(b.pellets_containers?.length||0),0);

  return <div>
    {loading&&<div className="empty" style={{padding:16}}>Carregando...</div>}

    {/* Form novo/editar booking */}
    <div style={{background:"var(--bg3)",borderRadius:10,padding:"12px 14px",marginBottom:12}}>
      <div style={{fontWeight:500,fontSize:12,color:"var(--text2)",marginBottom:10,textTransform:"uppercase",letterSpacing:"0.5px"}}>
        {editId?"✏️ Editar booking":"+ Adicionar booking"}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1.2fr 1.2fr 1.4fr 110px 110px 110px auto",gap:8,alignItems:"end"}}>
        {[
          {label:"Booking *",field:"booking"},
          {label:"Ref. Agente (EM...)",field:"ref_agente"},
          {label:"Navio",field:"navio"},
          {label:"ETD",field:"etd",type:"date"},
          {label:"ETA",field:"eta",type:"date"},
          {label:"BL",field:"bl",type:"date"},
        ].map(({label,field,type="text"})=>(
          <div key={field} className="field">
            <label>{label}</label>
            <input type={type} value={bform[field]||""} onChange={e=>bu(field,e.target.value)}/>
          </div>
        ))}
      </div>
      <div style={{display:"flex",justifyContent:"flex-end",gap:6,marginTop:8}}>
        {editId&&<button className="btn bg2 bsm" onClick={()=>{setEditId(null);setBform(BE0);}}>Cancelar</button>}
        <button className="btn bgx bsm" onClick={saveBook} disabled={saving}>{saving?"Salvando...":"✓ Salvar booking"}</button>
      </div>
    </div>

    {/* Resumo */}
    {books.length>0&&<div style={{fontSize:12,color:"var(--text2)",marginBottom:8,fontWeight:500}}>
      {books.length} booking{books.length>1?"s":""} · {totalConts} container{totalConts!==1?"s":""}
    </div>}

    {/* Lista de bookings expansíveis */}
    {books.map((b,bi)=>{
      const conts=b.pellets_containers||[];
      const isOpen=expanded[b.id];
      return <div key={b.id} style={{border:"1px solid var(--border)",borderRadius:10,marginBottom:10,overflow:"hidden"}}>
        {/* Header do booking */}
        <div style={{display:"grid",gridTemplateColumns:"auto 1fr 1fr 1fr 60px auto",gap:10,padding:"10px 14px",background:"var(--bg3)",alignItems:"center",cursor:"pointer"}}
          onClick={()=>setExpanded(e=>({...e,[b.id]:!isOpen}))}>
          {/* Chevron */}
          <span style={{fontSize:14,color:"var(--text2)",transition:"transform .2s",display:"inline-block",transform:isOpen?"rotate(90deg)":"rotate(0deg)"}}>▶</span>
          {/* Booking + ref */}
          <div>
            <strong style={{color:"#7C3AED",fontFamily:"monospace",fontSize:13}}>{b.booking}</strong>
            {b.ref_agente&&<div style={{fontSize:11,color:"var(--text3)"}}>{b.ref_agente}</div>}
          </div>
          {/* Navio */}
          <div style={{fontSize:12}}>{b.navio||<span style={{color:"var(--text3)"}}>—</span>}</div>
          {/* ETD → ETA */}
          <div style={{fontSize:11,color:"var(--text2)"}}>
            {fmtDate(b.etd)&&<span>ETD {fmtDate(b.etd)}</span>}
            {fmtDate(b.eta)&&<span style={{marginLeft:4}}>→ ETA {fmtDate(b.eta)}</span>}
          </div>
          {/* Containers count */}
          <div style={{fontSize:11,color:"var(--text2)"}}>
            <span style={{background:"#EDE9FE",color:"#7C3AED",padding:"2px 8px",borderRadius:8,fontWeight:600,fontSize:11}}>📦 {conts.length}</span>
          </div>
          {/* Ações */}
          <div style={{display:"flex",gap:4}} onClick={e=>e.stopPropagation()}>
            <button className="btn bsm" style={{fontSize:10}} onClick={()=>{setEditId(b.id);setBform({booking:b.booking,ref_agente:b.ref_agente||"",navio:b.navio||"",etd:b.etd||"",eta:b.eta||"",bl:b.bl||""});setExpanded(e=>({...e,[b.id]:false}));}}>✏️</button>
            <button className="btn bsm" style={{fontSize:10,color:"#DC2626"}} onClick={()=>removeBook(b.id)}>🗑️</button>
          </div>
        </div>

        {/* Conteúdo expansível: containers */}
        {isOpen&&<div style={{padding:"12px 14px",borderTop:"1px solid var(--border)"}}>
          {/* Info extra do booking */}
          <div style={{display:"flex",gap:16,fontSize:11,color:"var(--text2)",marginBottom:12,flexWrap:"wrap"}}>
            <span><strong>BL:</strong> {b.bl?fmtDate(b.bl):"—"}</span>
          </div>

          {/* Tabela de containers */}
          {conts.length>0&&<div className="tw" style={{marginBottom:12}}>
            <table>
              <thead>
                <tr><th>#</th><th>Container</th><th>NF</th><th>Peso (ton)</th><th>Lacre</th><th>Estufagem</th><th></th></tr>
              </thead>
              <tbody>
                {conts.map((c,ci)=>(
                  <tr key={c.id}>
                    <td style={{color:"var(--text3)",fontSize:11}}>{c.numero||ci+1}</td>
                    <td><strong style={{fontFamily:"monospace",fontSize:12,color:"#7C3AED"}}>{c.container}</strong></td>
                    <td style={{fontSize:11}}>{c.nf||"—"}</td>
                    <td className="r">{c.peso_ton?fmtTon(c.peso_ton):"—"}</td>
                    <td style={{fontSize:11,color:"var(--text2)"}}>{c.lacre||"—"}</td>
                    <td style={{fontSize:11}}>{fmtDate(c.estufagem)}</td>
                    <td style={{whiteSpace:"nowrap"}}>
                      <button className="btn bsm" style={{fontSize:10}} onClick={()=>{
                        setAddingCont(b.id);
                        setEditContIdx(ci);
                        setCform({container:c.container,nf:c.nf||"",numero:c.numero||"",peso_ton:c.peso_ton||"",lacre:c.lacre||"",estufagem:c.estufagem||""});
                      }}>✏️</button>
                      <button className="btn bsm" style={{fontSize:10,color:"#DC2626",marginLeft:2}} onClick={()=>removeCont(c.id)}>🗑️</button>
                    </td>
                  </tr>
                ))}
              </tbody>
              {conts.length>1&&<tfoot>
                <tr>
                  <td colSpan={3} style={{padding:"6px 13px",fontWeight:600,fontSize:11,color:"var(--text2)"}}>TOTAL ({conts.length} containers)</td>
                  <td style={{padding:"6px 13px",fontWeight:700,color:"#7C3AED",textAlign:"right"}}>{fmtTon(conts.reduce((s,c)=>s+(parseFloat(c.peso_ton)||0),0))}</td>
                  <td colSpan={3}/>
                </tr>
              </tfoot>}
            </table>
          </div>}

          {/* Form container */}
          {addingCont===b.id
            ? <div style={{background:"var(--bg3)",borderRadius:8,padding:"10px 12px",marginTop:4}}>
                <div style={{fontWeight:500,fontSize:11,color:"var(--text2)",marginBottom:8,textTransform:"uppercase",letterSpacing:"0.5px"}}>
                  {editContIdx!==null?"✏️ Editar container":"+ Novo container"}
                </div>
                <div style={{display:"grid",gridTemplateColumns:"1.5fr 1fr 55px 100px 1fr 120px auto",gap:8,alignItems:"end"}}>
                  {[
                    {l:"Container *",f:"container"},
                    {l:"NF",f:"nf"},
                    {l:"Nº",f:"numero",t:"number"},
                    {l:"Peso (ton)",f:"peso_ton",t:"number"},
                    {l:"Lacre",f:"lacre"},
                    {l:"Estufagem",f:"estufagem",t:"date"},
                  ].map(({l,f,t="text"})=>(
                    <div key={f} className="field">
                      <label>{l}</label>
                      <input type={t} value={cform[f]||""} onChange={e=>cu(f,e.target.value)}/>
                    </div>
                  ))}
                  <div style={{display:"flex",gap:4,alignSelf:"flex-end"}}>
                    <button className="btn bgx bsm" onClick={()=>saveCont(b.id)} disabled={savingCont}>{savingCont?"...":"✓"}</button>
                    <button className="btn bg2 bsm" onClick={()=>{setAddingCont(null);setEditContIdx(null);setCform(CE0);}}>✕</button>
                  </div>
                </div>
                <div style={{marginTop:6,fontSize:10,color:"var(--text3)"}}>💡 1 NF por container. ETD/ETA herdados do booking.</div>
              </div>
            : <button className="btn bsm" style={{background:"#EDE9FE",color:"#7C3AED",border:"1px solid #DDD6FE",fontSize:11}}
                onClick={()=>{setAddingCont(b.id);setEditContIdx(null);setCform(CE0);}}>
                + Adicionar container
              </button>
          }
        </div>}
      </div>;
    })}
  </div>;
}

/* ── ABA PELLETS ─── */
function PgPell({notify,session}){
  const [recs,setRecs]=useState([]);
  const [loading,setLoading]=useState(false);
  const [modal,setModal]=useState(null);
  const [modalTab,setModalTab]=useState("dados"); // dados | bookings | pagamentos
  const [delRec,setDelRec]=useState(null);
  const [saving,setSaving]=useState(false);
  const [clientes,setClientes]=useState([]);
  const [bookCnt,setBookCnt]=useState({});
  const [contCnt,setContCnt]=useState({});
  const [pagAlerta,setPagAlerta]=useState({});
  const [pagCnt,setPagCnt]=useState({});
  const [q,setQ]=useState("");
  const [fSt,setFSt]=useState("");
  const [fCli,setFCli]=useState("");
  const [tab,setTab]=useState("lista");

  const E0={invoice:"",cliente:"",po:"",porto_carga:"IMBITUBA",destino:"",destino_pais:"",
    valor_eur:"",produto:"",lote:"",certificado:"",peso_ton:"",
    etd:"",eta:"",estufagem:"",dl_carga:"",status:"CARTEIRA",status_doc:"PENDENTE",
    cond_pgto:"80/20",agente:"",transportadora:"",mes_ref:"",nf_fiscal:"",obs:""};
  const [form,setForm]=useState(E0);
  const upd=(k,v)=>setForm(f=>({...f,[k]:v}));

  async function fetchRecs(){
    const {data,error}=await db.from("pellets_exportacoes").select("*").order("invoice");
    if(error){notify("Erro: "+error.message,"err");return [];}
    setRecs(data||[]);
    return data||[];
  }

  async function loadCounts(rows){
    if(!rows||!rows.length)return;
    const [bk,cn,pg]=await Promise.all([
      db.from("pellets_bookings").select("pellet_id"),
      db.from("pellets_containers").select("booking_id,pellets_bookings!inner(pellet_id)"),
      db.from("pellets_pagamentos").select("pellet_id,recebido,dt_prevista")
    ]);
    const bm={};(bk.data||[]).forEach(r=>{bm[r.pellet_id]=(bm[r.pellet_id]||0)+1;});
    setBookCnt(bm);
    const cm={};
    (cn.data||[]).forEach(r=>{const pid=r.pellets_bookings?.pellet_id;if(pid)cm[pid]=(cm[pid]||0)+1;});
    setContCnt(cm);
    const hoje=new Date().toISOString().slice(0,10);
    const pm={};
    const pcm={};
    (pg.data||[]).forEach(r=>{
      pcm[r.pellet_id]=(pcm[r.pellet_id]||0)+1;
      if(!r.recebido&&r.dt_prevista&&r.dt_prevista<=hoje)
        pm[r.pellet_id]=(pm[r.pellet_id]||0)+1;
    });
    setPagCnt(pcm);
    setPagAlerta(pm);
  }

  async function load(){
    setLoading(true);
    const rows=await fetchRecs();
    await loadCounts(rows);
    setLoading(false);
  }

  useEffect(()=>{load();},[]);
  useEffect(()=>{
    db.from("cadastro_clientes").select("nome").order("nome").then(({data})=>{
      setClientes((data||[]).map(r=>r.nome));
    });
  },[]);

  const filtered=useMemo(()=>recs.filter(r=>{
    if(q&&!String(r.invoice||"").toLowerCase().includes(q.toLowerCase())&&!(r.cliente||"").toLowerCase().includes(q.toLowerCase()))return false;
    if(fSt&&r.status!==fSt)return false;
    if(fCli&&r.cliente!==fCli)return false;
    return true;
  }),[recs,q,fSt,fCli]);

  const kpis=useMemo(()=>({
    fat:recs.reduce((s,r)=>s+(parseFloat(r.valor_eur)||0),0),
    cnt:recs.length,
    pipeline:recs.filter(r=>!["ENTREGUE","CANCELADO"].includes(r.status)).reduce((s,r)=>s+(parseFloat(r.valor_eur)||0),0),
    embarcados:recs.filter(r=>["EMBARCADO","ENTREGUE"].includes(r.status)).length,
    peso:recs.reduce((s,r)=>s+(parseFloat(r.peso_ton)||0),0),
    alertas:Object.values(pagAlerta).reduce((s,v)=>s+v,0),
  }),[recs,pagAlerta]);

  const byCli=useMemo(()=>{const m={};recs.forEach(r=>{const c=r.cliente||"—";m[c]=(m[c]||0)+(parseFloat(r.valor_eur)||0);});return Object.entries(m).sort(([,a],[,b])=>b-a).map(([l,v])=>({l,v}));},[recs]);
  const byDst=useMemo(()=>{const m={};recs.forEach(r=>{const d=r.destino_pais||r.destino||"—";m[d]=(m[d]||0)+1;});return Object.entries(m).sort(([,a],[,b])=>b-a).map(([l,v])=>({l,v}));},[recs]);

  function openNew(){setForm(E0);setModalTab("dados");setModal("new");}
  function openEdit(r){
    setForm({invoice:r.invoice||"",cliente:r.cliente||"",po:r.po||"",porto_carga:r.porto_carga||"IMBITUBA",
      destino:r.destino||"",destino_pais:r.destino_pais||"",valor_eur:r.valor_eur||"",
      produto:r.produto||"",lote:r.lote||"",certificado:r.certificado||"",peso_ton:r.peso_ton||"",
      etd:r.etd||"",eta:r.eta||"",estufagem:r.estufagem||"",dl_carga:r.dl_carga||"",
      status:r.status||"CARTEIRA",status_doc:r.status_doc||"PENDENTE",cond_pgto:r.cond_pgto||"80/20",
      agente:r.agente||"",transportadora:r.transportadora||"",mes_ref:r.mes_ref||"",
      nf_fiscal:r.nf_fiscal||"",obs:r.obs||""});
    setModalTab("dados");setModal(r);
  }

  async function hSave(){
    if(!form.invoice){notify("Invoice obrigatório","err");return;}
    setSaving(true);
    const clean={...form};
    ["etd","eta","estufagem","dl_carga"].forEach(f=>{if(clean[f]==="")clean[f]=null;});
    ["valor_eur","peso_ton"].forEach(f=>{clean[f]=clean[f]!==""?parseFloat(clean[f])||null:null;});
    const {error}=await db.from("pellets_exportacoes").upsert(clean,{onConflict:"invoice"});
    setSaving(false);
    if(error){notify("Erro: "+error.message,"err");return;}
    // Se novo, mudar para aba bookings após salvar
    if(modal==="new"){
      const {data}=await db.from("pellets_exportacoes").select("*").eq("invoice",clean.invoice).single();
      if(data){setModal(data);setModalTab("bookings");}
    } else {
      setModal(m=>({...m,...clean}));
    }
    await load();notify("Salvo!");
  }

  async function hDel(invoice){
    await db.from("pellets_exportacoes").delete().eq("invoice",invoice);
    setDelRec(null);await load();notify("Excluído.");
  }

  const MODAL_TABS=[
    {id:"dados",label:"📋 Dados Gerais"},
    {id:"bookings",label:`🚢 Bookings${modal&&modal!=="new"&&bookCnt[modal.id]?` (${bookCnt[modal.id]})`:""}`,disabled:modal==="new"},
    {id:"pagamentos",label:"💰 Pagamentos",disabled:modal==="new"},
  ];

  return <div className="page">
    <div className="ph">
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:12}}>
        <div>
          <h2 style={{display:"flex",alignItems:"center",gap:8}}>🌲 Pellets
            <span style={{fontSize:14,fontWeight:400,color:"var(--text2)"}}>Exportação — EUR</span>
            {kpis.alertas>0&&<span style={{background:"#DC2626",color:"#fff",fontSize:11,fontWeight:700,borderRadius:10,padding:"2px 8px"}}>⚠ {kpis.alertas} pgto vencido</span>}
          </h2>
          <p>Invoice → Bookings → Containers (1 NF e 1 BL por container/booking)</p>
        </div>
        <div style={{display:"flex",gap:8,alignItems:"center"}}>
          <div className="tabs" style={{marginBottom:0,borderBottom:"none",gap:2}}>
            {[["lista","📋 Lista"],["dash","📊 Dashboard"]].map(([id,lb])=>(
              <div key={id} className={"tab"+(tab===id?" on":"")} style={{fontSize:12,padding:"6px 12px"}} onClick={()=>setTab(id)}>{lb}</div>
            ))}
          </div>
          <button className="btn" style={{background:"#7C3AED",color:"#fff"}} onClick={openNew}>+ Novo Invoice</button>
        </div>
      </div>
    </div>

    {/* KPIs */}
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))",gap:12,marginBottom:16}}>
      {[
        {l:"Faturamento Total",v:fmtEUR2(kpis.fat),s:kpis.cnt+" invoices",c:"#7C3AED"},
        {l:"Pipeline Ativo",v:fmtEUR2(kpis.pipeline),s:"em andamento",c:"var(--blue)"},
        {l:"Embarcados",v:kpis.embarcados,s:"em trânsito + entregues",c:"#059669"},
        {l:"Peso Total",v:fmtTon(kpis.peso),s:"toneladas",c:"var(--gold)"},
        ...(kpis.alertas>0?[{l:"Pgtos Vencidos",v:kpis.alertas,s:"aguardando confirmação",c:"#DC2626"}]:[]),
      ].map((k,i)=>(
        <div key={i} className="kp" style={{borderLeft:`3px solid ${k.c}`}}>
          <div className="kl" style={{color:k.c}}>{k.l}</div>
          <div className="kv" style={{fontSize:i===2?22:18,color:k.c}}>{k.v}</div>
          <div className="ks">{k.s}</div>
        </div>
      ))}
    </div>

    {tab==="dash"&&<>
      <div className="g2 mb20">
        <div className="card"><div className="ct">Por Cliente (EUR)</div>
          <div style={{marginTop:8}}>{byCli.map((d,i)=>{
            const pct=kpis.fat?Math.round(d.v/kpis.fat*100):0;
            return <div key={i} style={{marginBottom:8}}>
              <div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:3}}>
                <span style={{fontWeight:500}}>{d.l}</span>
                <span style={{color:"var(--text2)"}}>{fmtEUR2(d.v)} <span style={{color:"#7C3AED",fontWeight:600}}>({pct}%)</span></span>
              </div>
              <div style={{height:6,background:"var(--bg3)",borderRadius:3}}>
                <div style={{height:6,background:"#7C3AED",borderRadius:3,width:pct+"%"}}/>
              </div>
            </div>;
          })}</div>
        </div>
        <div className="card"><div className="ct">Por País</div>
          <div style={{marginTop:8}}>{byDst.map((d,i)=>(
            <div key={i} style={{display:"flex",justifyContent:"space-between",padding:"6px 0",borderBottom:"1px solid var(--border)",fontSize:13}}>
              <span>{d.l}</span><span style={{fontWeight:600,color:"#7C3AED"}}>{d.v}</span>
            </div>
          ))}</div>
        </div>
      </div>
      <div className="card mb20"><div className="ct">Por Status</div>
        <div style={{display:"flex",gap:10,flexWrap:"wrap",marginTop:10}}>
          {STATUS_PELL.map(s=>{const n=recs.filter(r=>r.status===s).length;if(!n)return null;
            return <div key={s} style={{background:"var(--bg3)",border:"1px solid var(--border)",borderRadius:8,padding:"10px 16px",textAlign:"center"}}>
              <div style={{fontFamily:"Syne",fontSize:22,fontWeight:700,color:"#7C3AED"}}>{n}</div>
              <div style={{fontSize:11,color:"var(--text2)",marginTop:2}}>{s}</div>
            </div>;
          })}
        </div>
      </div>
    </>}

    {tab==="lista"&&<>
      <div className="fb" style={{marginBottom:12}}>
        <input placeholder="Buscar invoice, cliente..." value={q} onChange={e=>setQ(e.target.value)} style={{width:220}}/>
        <select value={fCli} onChange={e=>setFCli(e.target.value)}>
          <option value="">Todos os clientes</option>
          {[...new Set(recs.map(r=>r.cliente).filter(Boolean))].sort().map(c=><option key={c}>{c}</option>)}
        </select>
        <select value={fSt} onChange={e=>setFSt(e.target.value)}>
          <option value="">Todos os status</option>
          {STATUS_PELL.map(s=><option key={s}>{s}</option>)}
        </select>
        {(q||fSt||fCli)&&<button className="btn bsm bg2" onClick={()=>{setQ("");setFSt("");setFCli("");}}>✕ Limpar</button>}
      </div>
      <div className="card">
        {loading?<div className="lw"><div className="spin2"/></div>:
        <div className="tw"><table>
          <thead><tr>
            <th>Invoice</th><th>Mês</th><th>Cliente</th><th>País</th>
            <th>Valor EUR</th><th>Peso</th><th>ETD</th><th>Cond.</th>
            <th>Bookings</th><th>Cont.</th><th>Pgto</th><th>Status</th><th></th>
          </tr></thead>
          <tbody>
            {filtered.length===0?<tr><td colSpan={13} className="empty">Nenhum invoice encontrado</td></tr>:
            filtered.map(r=>(
              <tr key={r.invoice} onClick={()=>openEdit(r)} style={{cursor:"pointer"}}>
                <td><strong style={{color:"#7C3AED"}}>{r.invoice}</strong></td>
                <td className="m">{r.mes_ref||"—"}</td>
                <td style={{fontWeight:500}}>{r.cliente||"—"}</td>
                <td style={{color:"var(--text2)",fontSize:11}}>{r.destino_pais||"—"}</td>
                <td className="r" style={{fontVariantNumeric:"tabular-nums",fontWeight:500,color:"#7C3AED"}}>{fmtEUR2(r.valor_eur)}</td>
                <td className="r" style={{fontSize:11}}>{r.peso_ton?fmtTon(r.peso_ton):"—"}</td>
                <td style={{fontSize:11}}>{fmtDate(r.etd)}</td>
                <td><span style={{fontSize:10,background:"#EDE9FE",color:"#7C3AED",padding:"2px 7px",borderRadius:8,fontWeight:600}}>{r.cond_pgto||"—"}</span></td>
                <td onClick={e=>{e.stopPropagation();openEdit(r);setTimeout(()=>setModalTab("bookings"),50);}}>
                  <span style={{background:"#EDE9FE",color:"#7C3AED",padding:"2px 8px",borderRadius:8,fontSize:11,fontWeight:600,cursor:"pointer"}}>🚢 {bookCnt[r.id]||0}</span>
                </td>
                <td style={{color:"var(--text2)",fontSize:12,textAlign:"center"}}>{contCnt[r.id]||0}</td>
                <td onClick={e=>{e.stopPropagation();openEdit(r);setTimeout(()=>setModalTab("pagamentos"),50);}}>
                  <span style={{
                      background:pagAlerta[r.id]?"#FEE2E2":pagCnt[r.id]?"#DCFCE7":"var(--bg3)",
                      color:pagAlerta[r.id]?"#DC2626":pagCnt[r.id]?"#059669":"var(--text3)",
                      padding:"2px 8px",borderRadius:8,fontSize:11,fontWeight:600,cursor:"pointer"}}>
                    {pagAlerta[r.id]?`⚠ ${pagAlerta[r.id]}`:pagCnt[r.id]?"✓":"—"}
                  </span>
                </td>
                <td><span className={"badge "+(PELL_CLR[r.status]||"bgg")}>{r.status||"—"}</span></td>
                <td onClick={e=>{e.stopPropagation();setDelRec(r);}}><button className="btn bd bsm">✕</button></td>
              </tr>
            ))}
          </tbody>
        </table></div>}
      </div>
    </>}

    {/* ── MODAL PRINCIPAL ── */}
    {modal&&<div className="overlay" onClick={()=>{setModal(null);load();}}>
      <div className="modal" style={{maxWidth:940}} onClick={e=>e.stopPropagation()}>
        <div className="mh">
          <h3 style={{color:"#7C3AED"}}>{modal==="new"?"🌲 Novo Invoice Pellet":"✏️ "+modal.invoice}</h3>
          <button className="btn bg2 bsm" onClick={()=>{setModal(null);load();}}>✕</button>
        </div>

        {/* Abas do modal */}
        <div style={{display:"flex",gap:2,padding:"0 24px",borderBottom:"1px solid var(--border)",background:"var(--bg3)"}}>
          {MODAL_TABS.map(t=>(
            <button key={t.id} disabled={t.disabled}
              style={{padding:"10px 16px",fontSize:12,fontWeight:modalTab===t.id?600:400,
                color:t.disabled?"var(--text3)":modalTab===t.id?"#7C3AED":"var(--text2)",
                background:"transparent",border:"none",borderBottom:modalTab===t.id?"2px solid #7C3AED":"2px solid transparent",
                cursor:t.disabled?"not-allowed":"pointer",marginBottom:-1,transition:"all .15s"}}
              onClick={()=>!t.disabled&&setModalTab(t.id)}>
              {t.label}
            </button>
          ))}
        </div>

        <div className="mb2">
          {/* ── ABA DADOS GERAIS ── */}
          {modalTab==="dados"&&<>
            <div className="st">Identificação</div>
            <div style={{display:"grid",gridTemplateColumns:"1.5fr 1fr 1.5fr",gap:12,marginBottom:16}}>
              <PellField label="Invoice *" field="invoice" form={form} upd={upd}/>
              <PellField label="Mês Ref" field="mes_ref" opts={ALL_MONTHS} form={form} upd={upd}/>
              <PellField label="Cliente" field="cliente" opts={clientes.length?clientes:undefined} form={form} upd={upd}/>
            </div>
            <hr className="dv"/>
            <div className="st">Produto</div>
            <div style={{display:"grid",gridTemplateColumns:"2fr 1fr 1fr",gap:12,marginBottom:16}}>
              <PellField label="Produto / Especificação" field="produto" form={form} upd={upd}/>
              <PellField label="Peso Total (ton)" field="peso_ton" type="number" form={form} upd={upd}/>
              <PellField label="Lote" field="lote" form={form} upd={upd}/>
            </div>
            <hr className="dv"/>
            <div className="st">Logística</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:12,marginBottom:16}}>
              <PellField label="Porto de Carga" field="porto_carga" opts={PORTOS_PELL} form={form} upd={upd}/>
              <PellField label="Destino (porto)" field="destino" form={form} upd={upd}/>
              <PellField label="Agente" field="agente" form={form} upd={upd}/>
              <PellField label="Transportadora" field="transportadora" opts={TRANSP} form={form} upd={upd}/>
            </div>
            <hr className="dv"/>
            <div className="st">Financeiro e Pagamento</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:12,marginBottom:16}}>
              <PellField label="Valor EUR" field="valor_eur" type="number" form={form} upd={upd}/>
              <PellField label="Cond. Pagamento" field="cond_pgto" opts={COND_PGTO_OPTS} form={form} upd={upd}/>
              <PellField label="Status" field="status" opts={STATUS_PELL} form={form} upd={upd}/>
            </div>
            {form.obs!==undefined&&<div className="field" style={{marginBottom:16}}>
              <label>Observações</label>
              <input value={form.obs||""} onChange={e=>upd("obs",e.target.value)} placeholder="Observações gerais..."/>
            </div>}
            <div className="mac">
              <button className="btn bg2" onClick={()=>{setModal(null);load();}}>Fechar</button>
              <button className="btn" style={{background:"#7C3AED",color:"#fff"}} onClick={hSave} disabled={saving}>
                {saving?"Salvando...":modal==="new"?"💾 Salvar e ir para Bookings →":"💾 Salvar"}
              </button>
            </div>
          </>}

          {/* ── ABA BOOKINGS ── */}
          {modalTab==="bookings"&&modal!=="new"&&<>
            <div style={{marginBottom:12,padding:"10px 14px",background:"var(--blue3)",borderRadius:8,fontSize:12,color:"var(--text2)"}}>
              <strong style={{color:"var(--blue)"}}>Invoice {modal.invoice}</strong> · {modal.cliente||"—"} · {fmtEUR2(modal.valor_eur||form.valor_eur)} · Cond: <strong>{modal.cond_pgto||form.cond_pgto}</strong>
            </div>
            <BookingsSection invoiceId={modal.id} invoice={modal.invoice} notify={notify}/>
          </>}

          {/* ── ABA PAGAMENTOS ── */}
          {modalTab==="pagamentos"&&modal!=="new"&&<>
            <div style={{marginBottom:12,padding:"10px 14px",background:"var(--blue3)",borderRadius:8,fontSize:12,color:"var(--text2)"}}>
              <strong style={{color:"var(--blue)"}}>Invoice {modal.invoice}</strong> · {fmtEUR2(parseFloat(modal.valor_eur||form.valor_eur)||0)} · Cond: <strong style={{color:"#7C3AED"}}>{modal.cond_pgto||form.cond_pgto||"não definida"}</strong>{(modal.etd||form.etd)&&<span> · ETD: <strong>{fmtDate(modal.etd||form.etd)}</strong></span>}
            </div>
            <PagamentosSection
              invoiceId={modal.id}
              valorTotal={modal.valor_eur||form.valor_eur}
              condPgto={modal.cond_pgto||form.cond_pgto}
              etdPrevisto={modal.etd||form.etd}
              notify={notify}/>
          </>}
        </div>
      </div>
    </div>}

    {delRec&&<div className="overlay" onClick={()=>setDelRec(null)}>
      <div className="modal" style={{maxWidth:380}} onClick={e=>e.stopPropagation()}>
        <div className="mh"><h3>Confirmar Exclusão</h3></div>
        <div className="mb2">
          <p>Excluir invoice <strong style={{color:"#7C3AED"}}>{delRec.invoice}</strong> ({delRec.cliente})?</p>
          <p style={{fontSize:12,color:"#DC2626",marginTop:8}}>⚠ Todos os bookings, containers e pagamentos serão removidos.</p>
          <div className="mac">
            <button className="btn bg2" onClick={()=>setDelRec(null)}>Cancelar</button>
            <button className="btn bd" onClick={()=>hDel(delRec.invoice)}>Excluir</button>
          </div>
        </div>
      </div>
    </div>}
  </div>;
}




ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
