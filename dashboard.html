      <div style={{display:"flex",gap:12,flexWrap:"wrap",alignItems:"center"}}>
        <select className="sel" value={fCli} onChange={e=>setFCli(e.target.value)} style={{minWidth:150}}>
          <option value="">Todos os clientes</option>
          {clientes.map(c=><option key={c}>{c}</option>)}
        </select>
        <select className="sel" value={fSt} onChange={e=>setFSt(e.target.value)} style={{minWidth:150}}>
          <option value="">Todos os status</option>
          {Object.keys(SHIP_STATUS_COLORS).map(s=><option key={s}>{s}</option>)}
        </select>
        {(fCli||fSt) && <button className="btn bsm" style={{fontSize:11}} onClick={()=>{setFCli("");setFSt("");}}>✕ Limpar</button>}
      </div>
    </div>

    {/* Tabela */}
    <div className="card">
      <div className="tw">
        <table className="cart-table">
          <thead><tr>
            <th>Cliente</th><th>Invoice</th><th>PO#</th><th>Navio</th>
            <th>ETD</th><th>ETA</th><th>Container</th><th>BL</th>
            <th>Status</th><th>Progresso</th>
          </tr></thead>
          <tbody>{filtered.length===0
            ?<tr><td colSpan={10} className="empty">Nenhum embarque encontrado</td></tr>
            :filtered.map(r=>{
              const sc = SHIP_STATUS_COLORS[r._shipSt]||SHIP_STATUS_COLORS.PENDING;
              return <tr key={r.invoice}>
                <td style={{fontWeight:500}}>{r.cliente||"—"}</td>
                <td><strong style={{color:"var(--blue)"}}>{r.invoice}</strong></td>
                <td>{fmtInt(r.po)}</td>
                <td>{r.navio||"—"}</td>
                <td>{fmtDate(r.etd)}</td>
                <td>{fmtDate(r.eta)}</td>
                <td>{r.container||"—"}</td>
                <td>{fmtDate(r.bl)}</td>
                <td><span style={{background:sc.bg,color:sc.color,border:`1px solid ${sc.border}`,padding:"3px 8px",borderRadius:10,fontSize:10,fontWeight:600,whiteSpace:"nowrap"}}>{r._shipSt}</span></td>
                <td><ShipProgress r={r}/></td>
              </tr>;
            })
          }</tbody>
        </table>
      </div>
    </div>
  </div>;
}

/* ══════════════════════════════════════════
   RECEBIMENTOS — Controle financeiro
══════════════════════════════════════════ */
/* Regras de previsão de pagamento por cliente */
const REGRA_PGTO = {
  "ECMD":      {tipo:"eta",     label:"ETA (chegada)"},
  "KLUMB":     {tipo:"eta",     label:"ETA (chegada)"},
  "METRIE":    {tipo:"etd",dias:30, label:"ETD +30d"},
  "WOODGRAIN": {tipo:"etd",dias:30, label:"ETD +30d"},
};

function calcPgtoPrevisto(r) {
  const regra = REGRA_PGTO[r.cliente];
  if(!regra) return null;
  if(regra.tipo==="eta" && r.eta) return r.eta;
  if(regra.tipo==="etd" && r.etd) {
    const d = new Date(r.etd+"T00:00:00");
    d.setDate(d.getDate()+(regra.dias||30));
    return d.toISOString().slice(0,10);
  }
  return null;
}

/* Categorizar pedido por status do workflow */
function catRecebimento(r) {
  const s = r.status || "";
  if(s==="EMBARCADO"||s==="ENTREGUE") return "EMBARCADO";
  if(s==="NO PORTO") return "PORTO";
  if(s==="AGD ESTUFAGEM") return "EM CASA PRONTO";
  return "FATURADOS NÃO PRONTOS"; /* EM PRODUÇÃO, CARTEIRA, vazio — tem NF = faturado */
}

const CAT_COLORS = {
  "EMBARCADO":            {bg:"#DBEAFE",color:"#1E40AF",border:"#BFDBFE"},
  "ATRASADO":             {bg:"#FEE2E2",color:"#991B1B",border:"#FECACA"},
  "FATURADOS NÃO PRONTOS":{bg:"#FEF3C7",color:"#92400E",border:"#FDE68A"},
  "EM CASA PRONTO":       {bg:"#E0F2FE",color:"#075985",border:"#BAE6FD"},
  "PORTO":                {bg:"#FFEDD5",color:"#9A3412",border:"#FED7AA"},
};

/* Cores de categoria para Excel Recebimentos */
const REC_XL_CAT = {
  "EMBARCADO":             {rgb:"92D050"},
  "ATRASADO":              {rgb:"FF0000"},
  "FATURADOS NÃO PRONTOS": {rgb:"FFFF00"},
  "EM CASA PRONTO":        {rgb:"00B0F0"},
  "PORTO":                 {rgb:"FFC000"},
};

function fmtDateBR(d) {
  if(!d) return "";
  const dt = new Date(d+"T00:00:00");
  if(isNaN(dt)) return "";
  return String(dt.getDate()).padStart(2,"0")+"/"+String(dt.getMonth()+1).padStart(2,"0");
}

function fmtDateBRFull(d) {
  if(!d) return "";
  const dt = new Date(d+"T00:00:00");
  if(isNaN(dt)) return "";
  return String(dt.getDate()).padStart(2,"0")+"/"+String(dt.getMonth()+1).padStart(2,"0")+"/"+dt.getFullYear();
}

function xlRecUSD(v) { return v ? "$"+Number(v).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}) : ""; }

function exportRecXLS(pendentes, cats) {
  const today = new Date();
  const aoa = [];

  /* Row 0: spacer */
  aoa.push([""]);
  /* Row 1: date in H (col index 7) */
  aoa.push(["","","","","","","",fmtDateBRFull(today.toISOString().slice(0,10))]);
  /* Row 2: headers */
  aoa.push(["","CLIENTE","NOTA","PEDIDO","EMISSÃO","VALOR","EMBARQUE","PAGAMENTO",""]);

  /* Data rows */
  pendentes.forEach(r => {
    aoa.push([
      "",
      r.cliente||"",
      fmtInt(r.nf),
      r.invoice||"",
      fmtDateBR(r.estufagem),
      xlRecUSD(r.valor_usd),
      fmtDateBR(r.etd || r.estufagem),
      fmtDateBR(r._prev),
      r._diasAte!==null ? r._diasAte : ""
    ]);
  });

  /* Total row */
  const totalRow = aoa.length;
  const totalUSD = pendentes.reduce((s,r)=>s+(r.valor_usd||0),0);
  aoa.push(["","","","","",xlRecUSD(totalUSD),"",pendentes.length,""]);
  aoa.push([""]); /* spacer */

  /* Category summary */
  const catOrder = ["EMBARCADO","ATRASADO","FATURADOS NÃO PRONTOS","EM CASA PRONTO","PORTO"];
  const catStartRow = aoa.length;
  catOrder.forEach(cat => {
    const c = cats[cat] || {cnt:0,val:0};
    aoa.push(["",cat,c.cnt,xlRecUSD(c.val)]);
  });

  const ws = XLSX.utils.aoa_to_sheet(aoa);

  /* ── STYLES ── */
  const dataFont = {name:"Calibri",sz:11};
  const centerAlign = {horizontal:"center",vertical:"center"};
  const dataCenter = {font:dataFont,alignment:centerAlign};

  /* Row 1: date */
  applyStyle(ws, XLSX.utils.encode_cell({r:1,c:7}), {font:{name:"Calibri",sz:11},alignment:{horizontal:"right"}});

  /* Row 2: headers */
  for(let c=1;c<=8;c++) applyStyle(ws, XLSX.utils.encode_cell({r:2,c}), {font:{name:"Calibri",sz:12,bold:true},alignment:centerAlign});

  /* Data rows */
  for(let r=3;r<3+pendentes.length;r++){
    const rec = pendentes[r-3];
    for(let c=1;c<=8;c++){
      let style = {font:dataFont,alignment:centerAlign};
      /* Col 6 (EMBARQUE) - color by category */
      if(c===6){
        const catColor = REC_XL_CAT[rec._cat];
        if(catColor) style = {font:dataFont,alignment:centerAlign,fill:{fgColor:{rgb:catColor.rgb}}};
      }
      applyStyle(ws, XLSX.utils.encode_cell({r,c}), style);
    }
  }

  /* Total row */
  applyStyle(ws, XLSX.utils.encode_cell({r:totalRow,c:5}), {font:{name:"Calibri",sz:11}});
  applyStyle(ws, XLSX.utils.encode_cell({r:totalRow,c:7}), {font:{name:"Calibri",sz:11,bold:true},alignment:centerAlign});

  /* Category summary */
  catOrder.forEach((cat,i) => {
    const row = catStartRow + i;
    const catColor = REC_XL_CAT[cat];
    applyStyle(ws, XLSX.utils.encode_cell({r:row,c:1}), {font:{name:"Calibri",sz:11},fill:{fgColor:{rgb:catColor?.rgb||"FFFFFF"}},alignment:centerAlign});
    applyStyle(ws, XLSX.utils.encode_cell({r:row,c:2}), {font:{name:"Calibri",sz:11},alignment:centerAlign});
    applyStyle(ws, XLSX.utils.encode_cell({r:row,c:3}), {font:{name:"Calibri",sz:11}});
  });

  /* Column widths matching reference */
  ws["!cols"] = [
    {wch:8.7},{wch:26.6},{wch:9.9},{wch:14},{wch:10.7},{wch:14.4},{wch:12.6},{wch:15.1},{wch:8.7}
  ];

  ws["!pageSetup"] = {orientation:"landscape",paperSize:9,fitToWidth:1,fitToHeight:0,fitToPage:true};
  ws["!printOptions"] = {gridLines:false};
  ws["!margins"] = {left:0.4,right:0.4,top:0.5,bottom:0.4};

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Plan1");
  XLSX.writeFile(wb, `TABELA_RECEBIMENTO_${fmtDateBR(today.toISOString().slice(0,10)).replace(/\//g,"-")}.xlsx`);
}

function PgRec({recs:allRecs, onSave, refresh, notify}) {
  const [regras,setRegras]=useState(REGRA_PGTO);
  useEffect(()=>{
    db.from("cadastro_prazos_pgto").select("*").then(({data})=>{
      const m={...REGRA_PGTO};
      (data||[]).forEach(r=>{
        // tipo "eta" com dias>0 = ETA+X dias; sem dias = ETA puro
        const label=r.tipo==="eta"?(r.dias&&r.dias>0?`ETA +${r.dias}d`:"ETA (chegada)"):`ETD +${r.dias}d`;
        m[r.cliente]={tipo:r.tipo,dias:r.dias||0,label};
      });
      setRegras(m);
    });
  },[]);
  /* Apenas registros live de 2026 que têm NF (faturados) e não foram recebidos */
  const pendentes = useMemo(()=>{
    return allRecs.filter(r=>!r._hist && r.nf && r.status_financeiro!=="RECEBIDO" && r.mes_ref && r.mes_ref.endsWith("2026")).map(r=>{
      const reg=regras[r.cliente];
      const prev=(()=>{
        if(!reg) return null;
        if(reg.tipo==="eta"&&r.eta){
          if(reg.dias&&reg.dias>0){const d=new Date(r.eta+"T00:00:00");d.setDate(d.getDate()+reg.dias);return d.toISOString().slice(0,10);}
          return r.eta;
        }
        if(reg.tipo==="etd"&&r.etd){const d=new Date(r.etd+"T00:00:00");d.setDate(d.getDate()+(reg.dias||0));return d.toISOString().slice(0,10);}
        return null;
      })();
      const _regraLabel=reg?reg.label||reg.tipo:"—";
      const cat = catRecebimento(r);
      if(!cat) return null;
      const hoje = new Date(); hoje.setHours(0,0,0,0);
      const prevDate = prev ? new Date(prev+"T00:00:00") : null;
      const diasAte = prevDate ? Math.round((prevDate - hoje)/(1000*60*60*24)) : null;
      const atrasado = prevDate && prevDate < hoje;
      return {...r, _prev:prev, _regraLabel, _cat:atrasado?"ATRASADO":cat, _diasAte:diasAte};
    }).filter(Boolean).sort((a,b)=>(a._diasAte||999)-(b._diasAte||999));
  },[allRecs,regras]);

  /* Recebidos de 2026 para análise */
  const recebidos = useMemo(()=>{
    return allRecs.filter(r=>!r._hist && r.data_pagamento && r.data_pagamento>="2026-01-01").map(r=>{
      const reg=regras[r.cliente];
      const prev=(()=>{
        if(!reg) return null;
        if(reg.tipo==="eta"&&r.eta){
          if(reg.dias&&reg.dias>0){const d=new Date(r.eta+"T00:00:00");d.setDate(d.getDate()+reg.dias);return d.toISOString().slice(0,10);}
          return r.eta;
        }
        if(reg.tipo==="etd"&&r.etd){const d=new Date(r.etd+"T00:00:00");d.setDate(d.getDate()+(reg.dias||0));return d.toISOString().slice(0,10);}
        return null;
      })();
      const _regraLabel=reg?reg.label||reg.tipo:"—";
      const real = r.data_pagamento;
      const diff = prev && real ? Math.round((new Date(real+"T00:00:00")-new Date(prev+"T00:00:00"))/(1000*60*60*24)) : null;
      return {...r, _prev:prev, _regraLabel, _diff:diff};
    });
  },[allRecs,regras]);

  /* KPIs */
  const totalPendente = pendentes.reduce((s,r)=>s+(r.valor_usd||0),0);
  const cntPendente = pendentes.length;
  const cats = useMemo(()=>{
    const m = {};
    pendentes.forEach(r=>{
      if(!m[r._cat]) m[r._cat]={cnt:0,val:0};
      m[r._cat].cnt++; m[r._cat].val+=(r.valor_usd||0);
    });
    return m;
  },[pendentes]);

  /* Prazo médio por cliente — apenas pedidos 2026+ */
  const prazoMedio = useMemo(()=>{
    const m = {};
    recebidos.filter(r=>r.data_pagamento>="2026-01-01").forEach(r=>{
      if(r._diff!==null){
        if(!m[r.cliente]) m[r.cliente]={sum:0,cnt:0};
        m[r.cliente].sum+=r._diff; m[r.cliente].cnt++;
      }
    });
    return Object.entries(m).map(([cli,d])=>({cli,avg:Math.round(d.sum/d.cnt),cnt:d.cnt})).sort((a,b)=>a.avg-b.avg);
  },[recebidos]);

  /* ── Marcar como recebido ── */
  async function markPaid(r) {
    const today = new Date().toISOString().slice(0,10);
    const {error} = await db.from("exportacoes").update({data_pagamento:today, status_financeiro:"RECEBIDO"}).eq("invoice",r.invoice);
    if(error){notify("Erro: "+error.message,"err");return;}
    await refresh(); notify(`Invoice ${r.invoice} marcada como recebida`);
  }

  /* ── Desfazer recebimento ── */
  async function undoPaid(r) {
    const {error} = await db.from("exportacoes").update({data_pagamento:null, status_financeiro:"PENDENTE"}).eq("invoice",r.invoice);
    if(error){notify("Erro: "+error.message,"err");return;}
    await refresh(); notify(`Invoice ${r.invoice} voltou para pendente`);
  }

  const CAT_ORDER = ["ATRASADO","EMBARCADO","PORTO","EM CASA PRONTO","FATURADOS NÃO PRONTOS"];

  return <div className="page">
    <div className="ph">
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:12}}>
        <div><h2>Recebimentos</h2><p>Controle de pagamentos pendentes — pedidos faturados</p></div>
        {cntPendente>0 && <button className="btn bgx bsm" onClick={()=>exportRecXLS(pendentes, cats)}>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Exportar Excel
        </button>}
      </div>
    </div>

    {/* KPIs */}
    <div className="kpi-grid4" style={{marginBottom:16}}>
      <div className="kp hi"><div className="kl">Total a Receber</div><div className="kv tc" style={{fontSize:18}}>{fmtUSD(totalPendente)}</div><div className="ks">{cntPendente} pedidos pendentes</div></div>
      {CAT_ORDER.filter(c=>cats[c]).map(c=>(
        <div key={c} className="kp" style={{borderLeft:`3px solid ${CAT_COLORS[c]?.border||"#E5E7EB"}`}}>
          <div className="kl">{c}</div>
          <div className="kv" style={{fontSize:16}}>{cats[c].cnt}</div>
          <div className="ks">{fmtUSD(cats[c].val)}</div>
        </div>
      ))}
    </div>

    {/* Tabela por categorias */}
    {CAT_ORDER.filter(c=>pendentes.some(r=>r._cat===c)).map(cat=>{
      const rows = pendentes.filter(r=>r._cat===cat);
      const cc = CAT_COLORS[cat]||{};
      return <div key={cat} className="card" style={{marginBottom:12}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <span style={{background:cc.bg,color:cc.color,border:`1px solid ${cc.border}`,padding:"3px 10px",borderRadius:12,fontSize:11,fontWeight:600}}>{cat}</span>
            <span style={{fontSize:12,color:"var(--text3)"}}>{rows.length} pedido{rows.length>1?"s":""} — {fmtUSD(rows.reduce((s,r)=>s+(r.valor_usd||0),0))}</span>
          </div>
        </div>
        <div className="tw">
          <table className="cart-table">
            <thead><tr>
              <th>Invoice</th><th>Cliente</th><th>PO#</th><th style={{textAlign:"right"}}>Valor USD</th>
              <th>ETD</th><th>ETA</th><th>Pgto Previsto</th><th>Dias</th><th>Ação</th>
            </tr></thead>
            <tbody>{rows.map(r=>(
              <tr key={r.invoice}>
                <td><strong style={{color:"var(--blue)"}}>{r.invoice}</strong></td>
                <td>{r.cliente||"—"}</td>
                <td>{fmtInt(r.po)}</td>
                <td style={{textAlign:"right",fontVariantNumeric:"tabular-nums",fontWeight:500}}>{fmtUSD(r.valor_usd)}</td>
                <td>{fmtDate(r.etd)}</td>
                <td>{fmtDate(r.eta)}</td>
                <td><div><div>{r._prev?fmtDate(r._prev):"—"}</div>{r._regraLabel&&r._prev?<div style={{fontSize:10,color:"var(--text3)",marginTop:2}}>{r._regraLabel}</div>:null}</div>{r._regraLabel&&r._prev?<div style={{fontSize:10,color:"var(--text3)",marginTop:2}}>{r._regraLabel}</div>:null}</td>
                <td style={{fontWeight:600,color:r._diasAte!==null?(r._diasAte<0?"#059669":"#991B1B"):"var(--text3)"}}>
                  {r._diasAte!==null?(r._diasAte<=0?`${Math.abs(r._diasAte)}d`:`+${r._diasAte}d`):"—"}
                </td>
                <td>
                  <button className="btn bgx" style={{fontSize:11,padding:"3px 10px"}} onClick={()=>markPaid(r)} title="Marcar como recebido">✓ Recebido</button>
                </td>
              </tr>
            ))}</tbody>
          </table>
        </div>
      </div>;
    })}

    {/* Análise — Recebidos recentes + Prazo médio */}
    {(recebidos.length>0||prazoMedio.length>0) && <div className="g2" style={{marginTop:16}}>
      {/* Prazo médio por cliente */}
      {prazoMedio.length>0 && <div className="card">
        <div className="ct">Prazo Médio de Recebimento por Cliente</div>
        <div style={{marginTop:10}}>
          {prazoMedio.map(p=>(
            <div key={p.cli} style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
              <div style={{width:90,fontSize:12,fontWeight:500,color:"var(--text)"}}>{p.cli}</div>
              <div style={{flex:1,height:6,background:"#EEF2F6",borderRadius:3,overflow:"hidden"}}>
                <div style={{width:`${Math.min(Math.abs(p.avg)/60*100,100)}%`,height:"100%",background:p.avg>0?"#DC2626":"#059669",borderRadius:3}}/>
              </div>
              <div style={{fontSize:12,fontWeight:600,color:p.avg>0?"#DC2626":"#059669",minWidth:60,textAlign:"right"}}>
                {p.avg>0?`+${p.avg}d atraso`:`${Math.abs(p.avg)}d antecipado`}
              </div>
              <div style={{fontSize:10,color:"var(--text3)"}}>{p.cnt} pgtos</div>
            </div>
          ))}
        </div>
      </div>}

      {/* Últimos recebimentos */}
      {recebidos.length>0 && <div className="card">
        <div className="ct">Recebimentos 2026</div>
        <div className="tw" style={{marginTop:10}}>
          <table className="cart-table">
            <thead><tr><th>Invoice</th><th>Cliente</th><th style={{textAlign:"right"}}>Valor</th><th>Pago em</th><th>Δ Dias</th>
              <th>Ação</th>
            </tr></thead>
            <tbody>{recebidos.slice(0,15).map(r=>(
              <tr key={r.invoice}>
                <td><strong>{r.invoice}</strong></td>
                <td>{r.cliente||"—"}</td>
                <td style={{textAlign:"right",fontVariantNumeric:"tabular-nums"}}>{fmtUSD(r.valor_usd)}</td>
                <td>{fmtDate(r.data_pagamento)}</td>
                <td style={{fontWeight:600,color:r._diff!==null?(r._diff>0?"#DC2626":"#059669"):"var(--text3)"}}>
                  {r._diff!==null?(r._diff>0?`+${r._diff}d`:`${r._diff}d`):"—"}
                </td>
                <td>
                  <button className="btn" style={{fontSize:10,padding:"2px 8px",background:"#FEF3C7",color:"#92400E",border:"1px solid #FDE68A"}} onClick={()=>undoPaid(r)} title="Desfazer recebimento">↩ Desfazer</button>
                </td>
              </tr>
            ))}</tbody>
          </table>
        </div>
      </div>}
    </div>}

    {/* Mensagem quando não há pendentes */}
    {cntPendente===0 && <div className="card" style={{textAlign:"center",padding:"40px 20px",color:"var(--text3)"}}>
      <div style={{fontSize:32,marginBottom:8}}>✓</div>
      <div style={{fontSize:14}}>Nenhum recebimento pendente</div>
      <div style={{fontSize:12,marginTop:4}}>Todos os pedidos faturados foram recebidos</div>
    </div>}
  </div>;
}

/* ══════════════════════════════════════════
   BASE DE DADOS
══════════════════════════════════════════ */
function PgBase({recs:allRecs,onSave,onDel,notify, q,setQ, fC,setFC, fM,setFM, fD,setFD, cadData}) {
  /* Base de dados editável só mostra registros ao vivo (não-históricos) */
  const recs = useMemo(()=>allRecs.filter(r=>!r._hist),[allRecs]);
  const [modal,setModal]=useState(null); const [del,setDel]=useState(null); const [saving,setSaving]=useState(false);
  const avail=useMemo(()=>{const s=new Set();recs.forEach(r=>{if(r.mes_ref)s.add(r.mes_ref)});return [...s].sort();},[recs]);
  const fil=useMemo(()=>recs.filter(r=>{
    if(q&&!String(r.invoice).includes(q)&&!(r.cliente||'').toLowerCase().includes(q.toLowerCase())&&!(r.navio||'').toLowerCase().includes(q.toLowerCase())&&!(r.container||'').toLowerCase().includes(q.toLowerCase())&&!String(r.booking||'').toLowerCase().includes(q.toLowerCase())) return false;
    if(fC&&r.cliente!==fC) return false;
    if(fM&&r.mes_ref!==fM) return false;
    if(fD&&r.status_doc!==fD) return false;
    return true;
  }),[recs,q,fC,fM,fD]);

  const E0={invoice:"",cliente:"",po:"",nf:"",porto_carga:"IMBITUBA",destino:"",navio:"",container:"",booking:"",transportadora:"",valor_usd:"",frete_usd:"",agente:"",isf_docs:"",bl:"",status_doc:"PENDENTE",dl_carga:"",estufagem:"",eta_pedido:"",etd:"",eta:"",status:"",mes_ref:""};
  const [form,setForm]=useState(E0);
  const upd=(k,v)=>setForm(f=>({...f,[k]:v}));

  function openEdit(r){setForm({invoice:r.invoice||"",cliente:r.cliente||"",po:r.po||"",nf:r.nf||"",porto_carga:r.porto_carga||"IMBITUBA",destino:r.destino||"",navio:r.navio||"",container:r.container||"",booking:r.booking||"",transportadora:r.transportadora||"",valor_usd:r.valor_usd||"",frete_usd:r.frete_usd||"",agente:r.agente||"",isf_docs:r.isf_docs||"",bl:r.bl||"",status_doc:r.status_doc||"PENDENTE",dl_carga:r.dl_carga||"",estufagem:r.estufagem||"",eta_pedido:r.eta_pedido||"",etd:r.etd||"",eta:r.eta||"",status:r.status||"",mes_ref:r.mes_ref||""});setModal(r);}

  /* Estado para confirmação de sobrescrita por duplicidade */
  const [dupConfirm,setDupConfirm]=useState(null);

  /* Construção do payload final que será enviado ao Supabase */
  function buildPayload(){
    return {...form,invoice:parseInt(form.invoice),valor_usd:parseFloat(form.valor_usd)||null,frete_usd:parseFloat(form.frete_usd)||null,isf_docs:form.isf_docs||null,bl:form.bl||null,dl_carga:form.dl_carga||null,estufagem:form.estufagem||null,eta_pedido:form.eta_pedido||null};
  }

  /* Persistência efetiva — chamada após validações */
  async function doSave(payload){
    setSaving(true);
    const ok=await onSave(payload);
    setSaving(false);
    if(ok){setModal(null);setDupConfirm(null);}
    return ok;
  }

  async function hSave(){
    if(!form.invoice){notify("Invoice obrigatório","err");return;}
    if(!form.mes_ref){notify("Mês de referência obrigatório","err");return;}

    const newInv=parseInt(form.invoice);
    if(isNaN(newInv)||newInv<=0){notify("Invoice deve ser número positivo","err");return;}

    /* Detectar duplicidade ANTES de salvar
       - "new": qualquer match em recs ao vivo (não-histórico) é duplicata
       - editando: só é duplicata se a invoice mudou para uma que já existe em outro registro */
    const isNew=modal==="new";
    const originalInv=isNew?null:(modal&&modal.invoice);
    const invChanged=!isNew&&newInv!==originalInv;

    if(isNew||invChanged){
      const conflito=allRecs.find(r=>!r._hist&&r.invoice===newInv);
      if(conflito){
        setDupConfirm({existing:conflito,payload:buildPayload()});
        return;
      }
    }

    await doSave(buildPayload());
  }

  return <div className="page">
    <div className="ph">
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:12,flexWrap:"wrap"}}>
        <div><h2>Base de Dados</h2><p>{recs.length} registros · {fil.length} exibidos</p></div>
        <button className="btn bp" onClick={()=>{setForm(E0);setModal("new")}}>+ Novo Embarque</button>
      </div>
    </div>
    <div className="fb">
      <input placeholder="Buscar invoice, cliente, navio, container, booking..." value={q} onChange={e=>setQ(e.target.value)} style={{width:260}}/>
      <select value={fC} onChange={e=>setFC(e.target.value)}><option value="">Todos os clientes</option>{CLIENTES.map(c=><option key={c}>{c}</option>)}</select>
      <select value={fM} onChange={e=>setFM(e.target.value)}><option value="">Todos os meses</option>{avail.map(m=><option key={m}>{m}</option>)}</select>
      <select value={fD} onChange={e=>setFD(e.target.value)}><option value="">Todos status doc</option>{STATUS_DOC.map(s=><option key={s}>{s}</option>)}</select>
      <button className="btn bg2 bsm" onClick={()=>{setQ("");setFC("");setFM("");setFD("")}}>Limpar</button>
    </div>
    <div className="card">
      <div className="tw"><table>
        <thead><tr><th>Invoice</th><th>Mês Ref</th><th>Cliente</th><th>Destino</th><th>Valor USD</th><th>Frete USD</th><th>Agente</th><th>Container</th><th>ETA</th><th>Status Doc</th><th>Status</th><th></th></tr></thead>
        <tbody>
          {fil.length===0?<tr><td colSpan={12} className="empty">Nenhum registro encontrado</td></tr>
          :fil.map(r=><tr key={r.invoice} onClick={()=>openEdit(r)}>
            <td><strong style={{color:"var(--blue)"}}>{r.invoice}</strong></td>
            <td className="m">{r.mes_ref}</td>
            <td>{r.cliente}</td><td>{r.destino||"—"}</td>
            <td className="r">{fmtUSD(r.valor_usd)}</td><td className="r">{fmtUSD(r.frete_usd)}</td>
            <td className="m">{r.agente?.split(" -")[0]||"—"}</td><td className="m">{r.container||"—"}</td>
            <td>{fmtDate(r.eta_pedido)}</td>
            <td><DocBadge v={r.status_doc}/></td><td><EmbBadge v={r.status}/></td>
            <td onClick={e=>{e.stopPropagation();setDel(r)}}><button className="btn bd bsm">✕</button></td>
          </tr>)}
        </tbody>
      </table></div>
    </div>

    {modal&&<div className="overlay" onClick={()=>setModal(null)}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="mh"><h3>{modal==="new"?"Novo Embarque":"Editar — INV "+modal.invoice}</h3><button className="btn bg2 bsm" onClick={()=>setModal(null)}>✕</button></div>
        <div className="mb2">
          <div className="st">Identificação</div>
          <div className="fr mb16"><Field label="Invoice *" field="invoice" type="number" form={form} upd={upd}/><Field label="Mês Ref *" field="mes_ref" opts={ALL_MONTHS} form={form} upd={upd}/><Field label="Cliente" field="cliente" opts={cadData?.clientes?.length?cadData.clientes:CLIENTES} form={form} upd={upd}/><Field label="PO#" field="po" form={form} upd={upd}/><Field label="NF" field="nf" form={form} upd={upd}/></div>
          <hr className="dv"/>
          <div className="st">Logística</div>
          <div className="fr mb16"><Field label="Porto de Carga" field="porto_carga" opts={cadData?.portos?.length?cadData.portos:PORTOS} form={form} upd={upd}/><Field label="Destino" field="destino" opts={cadData?.destinos?.length?cadData.destinos:DESTINOS} form={form} upd={upd}/><Field label="Navio" field="navio" form={form} upd={upd}/><Field label="Container" field="container" form={form} upd={upd}/><Field label="Booking" field="booking" form={form} upd={upd}/><Field label="Transportadora" field="transportadora" opts={cadData?.transportadoras?.length?cadData.transportadoras:TRANSP} form={form} upd={upd}/></div>
          <hr className="dv"/>
          <div className="st">Financeiro</div>
          <div className="fr mb16"><Field label="Valor USD" field="valor_usd" type="number" form={form} upd={upd}/><Field label="Frete USD" field="frete_usd" type="number" form={form} upd={upd}/><Field label="Agente" field="agente" form={form} upd={upd}/></div>
          <hr className="dv"/>
          <div className="st">Documentação e Datas</div>
          <div className="fr"><Field label="ISF/DOCS" field="isf_docs" type="date" form={form} upd={upd}/><Field label="BL" field="bl" type="date" form={form} upd={upd}/><Field label="Status Doc" field="status_doc" opts={STATUS_DOC} form={form} upd={upd}/><Field label="DL Carga" field="dl_carga" type="date" form={form} upd={upd}/><Field label="Estufagem" field="estufagem" type="date" form={form} upd={upd}/><Field label="ETA Pedido" field="eta_pedido" type="date" form={form} upd={upd}/><Field label="ETD" field="etd" type="date" form={form} upd={upd}/><Field label="ETA" field="eta" type="date" form={form} upd={upd}/><Field label="Status" field="status" opts={STATUS_EMB} form={form} upd={upd}/></div>
          <div className="mac"><button className="btn bg2" onClick={()=>setModal(null)}>Cancelar</button><button className="btn bp" onClick={hSave} disabled={saving}>{saving?"Salvando...":"Salvar"}</button></div>
        </div>
      </div>
    </div>}
    {del&&<div className="overlay" onClick={()=>setDel(null)}>
      <div className="modal" style={{maxWidth:380}} onClick={e=>e.stopPropagation()}>
        <div className="mh"><h3>Confirmar Exclusão</h3></div>
        <div className="mb2">
          <p>Excluir <strong>INV {del.invoice}</strong> ({del.cliente})?</p>
          <p style={{fontSize:12,color:"var(--text2)",marginTop:8}}>Esta ação não pode ser desfeita.</p>
          <div className="mac"><button className="btn bg2" onClick={()=>setDel(null)}>Cancelar</button><button className="btn bd" onClick={()=>{onDel(del.invoice);setDel(null)}}>Excluir</button></div>
        </div>
      </div>
    </div>}
    {dupConfirm&&<div className="overlay" onClick={()=>setDupConfirm(null)}>
      <div className="modal" style={{maxWidth:480}} onClick={e=>e.stopPropagation()}>
        <div className="mh"><h3 style={{color:"var(--red)"}}>⚠ Invoice já existe</h3></div>
        <div className="mb2">
          <p style={{marginBottom:14}}>Já existe um embarque cadastrado com a invoice <strong style={{color:"var(--blue)"}}>{dupConfirm.existing.invoice}</strong>:</p>
          <div style={{background:"#FEF8F0",border:"1px solid #FBBF24",borderRadius:8,padding:"12px 14px",marginBottom:14}}>
            <div style={{display:"grid",gridTemplateColumns:"100px 1fr",gap:"6px 10px",fontSize:13}}>
              <div style={{color:"var(--text2)"}}>Cliente:</div><div><strong>{dupConfirm.existing.cliente||"—"}</strong></div>
              <div style={{color:"var(--text2)"}}>Mês Ref:</div><div>{dupConfirm.existing.mes_ref||"—"}</div>
              <div style={{color:"var(--text2)"}}>Destino:</div><div>{dupConfirm.existing.destino||"—"}</div>
              <div style={{color:"var(--text2)"}}>Valor USD:</div><div>{fmtUSD(dupConfirm.existing.valor_usd)}</div>
              <div style={{color:"var(--text2)"}}>Container:</div><div className="m">{dupConfirm.existing.container||"—"}</div>
            </div>
          </div>
          <p style={{fontSize:13,color:"var(--text2)",marginBottom:6}}>Se você confirmar, <strong style={{color:"var(--red)"}}>os dados acima serão substituídos</strong> pelos dados do formulário. Essa ação <strong>não pode ser desfeita</strong>.</p>
          <p style={{fontSize:12,color:"var(--text3)",marginBottom:14}}>Se foi um erro de digitação na invoice, clique em "Voltar" e corrija o número.</p>
          <div className="mac"><button className="btn bg2" onClick={()=>setDupConfirm(null)}>← Voltar e corrigir</button><button className="btn bd" disabled={saving} onClick={()=>doSave(dupConfirm.payload)}>{saving?"Substituindo...":"Substituir mesmo assim"}</button></div>
        </div>
      </div>
    </div>}
  </div>;
}

/* ══════════════════════════════════════════
   CADASTROS — Clientes, Portos, Destinos, Transportadoras
══════════════════════════════════════════ */
const CAD_TABS = [
  {key:"clientes",label:"Clientes",table:"cadastro_clientes"},
  {key:"portos",label:"Portos",table:"cadastro_portos"},
  {key:"destinos",label:"Destinos",table:"cadastro_destinos"},
  {key:"transportadoras",label:"Transportadoras",table:"cadastro_transportadoras"},
  {key:"prazos",label:"Prazos de Pagamento",table:"cadastro_prazos_pgto",special:"prazos"},
];

function PgCad({cadData, refreshCad, notify}) {
  const [tab,setTab]=useState("clientes");
  const [newVal,setNewVal]=useState("");
  const [editId,setEditId]=useState(null);
  const [editVal,setEditVal]=useState("");
  const [items,setItems]=useState([]);
  const [loading,setLoading]=useState(false);

  const current = CAD_TABS.find(t=>t.key===tab);

  /* Carregar items da tabela selecionada */
  async function loadItems() {
    setLoading(true);
    const {data,error}=await db.from(current.table).select("*").order("nome");
    if(error) notify("Erro: "+error.message,"err");
    else setItems(data||[]);
    setLoading(false);
  }

  useEffect(()=>{ loadItems(); setNewVal(""); setEditId(null); },[tab]);

  /* Adicionar */
  async function addItem() {
    const val = newVal.trim().toUpperCase();
    if(!val){notify("Digite um nome","err");return;}
    if(items.some(i=>i.nome===val)){notify("Já existe","err");return;}
    const {error}=await db.from(current.table).insert({nome:val});
    if(error){notify("Erro: "+error.message,"err");return;}
    setNewVal("");
    await loadItems();
    await refreshCad();
    notify(`${val} adicionado`);
  }

  /* Editar */
  async function saveEdit(id) {
    const val = editVal.trim().toUpperCase();
    if(!val){notify("Nome não pode ser vazio","err");return;}
    if(items.some(i=>i.nome===val&&i.id!==id)){notify("Já existe","err");return;}
    const {error}=await db.from(current.table).update({nome:val}).eq("id",id);
    if(error){notify("Erro: "+error.message,"err");return;}
    setEditId(null);
    await loadItems();
    await refreshCad();
    notify("Atualizado");
  }

  /* Remover */
  async function removeItem(id, nome) {
    if(!confirm(`Remover "${nome}"?`)) return;
    const {error}=await db.from(current.table).delete().eq("id",id);
    if(error){notify("Erro: "+error.message,"err");return;}
    await loadItems();
    await refreshCad();
    notify(`${nome} removido`);
  }

  return <div className="page">
    <div className="ph">
      <h2>Cadastros</h2>
      <p>Gerenciar listas de clientes, portos, destinos e transportadoras</p>
    </div>

    {/* Sub-tabs */}
    <div className="tabs">
      {CAD_TABS.map(t=>(
        <div key={t.key} className={`tab ${tab===t.key?"on":""}`} onClick={()=>setTab(t.key)}>{t.label}</div>
      ))}
    </div>

    {/* Adicionar novo */}
    <div className="card mb20">
      <div style={{display:"flex",gap:10,alignItems:"center"}}>
        <input className="sel" style={{flex:1}} placeholder={`Novo ${current.label.slice(0,-1).toLowerCase()}...`} value={newVal} onChange={e=>setNewVal(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addItem()}/>
        <button className="btn bgx" onClick={addItem}>+ Adicionar</button>
      </div>
    </div>

    {/* Lista */}
    <div className="card">
      {current.special==="prazos" ? <PrazosPanel notify={notify}/> :
      loading ? <div className="empty">Carregando...</div> :
      items.length===0 ? <div className="empty">Nenhum cadastro</div> :
      <div>{items.map(item=>(
        <div key={item.id} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 0",borderBottom:"1px solid var(--border)"}}>
          {editId===item.id ? <>
            <input className="sel" style={{flex:1}} value={editVal} onChange={e=>setEditVal(e.target.value)} onKeyDown={e=>e.key==="Enter"&&saveEdit(item.id)} autoFocus/>
            <button className="btn bgx bsm" onClick={()=>saveEdit(item.id)}>Salvar</button>
            <button className="btn bsm" onClick={()=>setEditId(null)}>Cancelar</button>
          </> : <>
            <div style={{flex:1,fontSize:14,fontWeight:500,color:"var(--text)"}}>{item.nome}</div>
            <button className="btn bsm" style={{fontSize:11}} onClick={()=>{setEditId(item.id);setEditVal(item.nome);}}>✏️ Editar</button>
            <button className="btn bsm" style={{fontSize:11,color:"#DC2626"}} onClick={()=>removeItem(item.id,item.nome)}>🗑️ Remover</button>
          </>}
        </div>
      ))}</div>}
    </div>
  </div>;
}

/* ══════════════════════════════════════════
   RELATÓRIOS
══════════════════════════════════════════ */
function PgRel({recs, tab, setTab, yr, setYr, mes, setMes, notify}) {
  const avail=useMemo(()=>{const s=new Set();recs.forEach(r=>{if(r.mes_ref)s.add(r.mes_ref)});return [...s].sort();},[recs]);

  const monthly=useMemo(()=>{
    const rows=recs.filter(r=>r.mes_ref===mes);
    const bC={},bD={};let fat=0,fret=0;
    rows.forEach(r=>{fat+=r.valor_usd||0;fret+=r.frete_usd||0;const c=r.cliente||"—";bC[c]=(bC[c]||0)+(r.valor_usd||0);const d=r.destino||"—";bD[d]=(bD[d]||0)+1;});
    return {rows,fat,fret,cnt:rows.length,bC,bD};
  },[recs,mes]);

  /* YoY para o mês selecionado: mesmo mês do ano anterior */
  const monthlyPrev=useMemo(()=>{
    const parts=mes.split(" ");if(parts.length<2)return{fat:0,fret:0,cnt:0};
    const prevMes=parts[0]+" "+String(parseInt(parts[1])-1);
    const rows=recs.filter(r=>r.mes_ref===prevMes);
    return {fat:rows.reduce((s,r)=>s+(r.valor_usd||0),0),fret:rows.reduce((s,r)=>s+(r.frete_usd||0),0),cnt:rows.length,label:prevMes};
  },[recs,mes]);

  const YoYBadge = ({cur, prev, label, invert=false}) => {
    if(!prev || prev===0) return null;
    const pct = ((cur/prev)-1)*100;
    const up = pct >= 0;
    const good = invert ? !up : up;
    const color = good ? "#059669" : "#DC2626";
    const arrow = up ? "▲" : "▼";
    return <div style={{display:"inline-flex",alignItems:"center",gap:3,fontSize:11,fontWeight:600,color,marginTop:4}}>
      <span>{arrow}</span><span>{Math.abs(pct).toFixed(1)}%</span>
      {label&&<span style={{fontWeight:400,color:"var(--text3)",fontSize:10}}>vs {label}</span>}
    </div>;
  };

  const annual=useMemo(()=>{
    const rows=recs.filter(r=>r.mes_ref?.includes(yr));
    const bM={};MESES.forEach(m=>{bM[m]={fat:0,cnt:0,fret:0}});
    rows.forEach(r=>{const m=r.mes_ref?.split(" ")[0];if(m&&bM[m]){bM[m].fat+=r.valor_usd||0;bM[m].fret+=r.frete_usd||0;bM[m].cnt++;}});
    const list=Object.entries(bM).filter(([,v])=>v.cnt>0).map(([m,v])=>({m,...v}));
    const tot={fat:list.reduce((s,r)=>s+r.fat,0),cnt:list.reduce((s,r)=>s+r.cnt,0),fret:list.reduce((s,r)=>s+r.fret,0)};
    return {list,tot};
  },[recs,yr]);

  /* Dados do ano anterior para comparação mês a mês */
  const prevYrRel = String(parseInt(yr)-1);
  const annualPrev=useMemo(()=>{
    const rows=recs.filter(r=>r.mes_ref?.includes(prevYrRel));
    const bM={};MESES.forEach(m=>{bM[m]={fat:0,cnt:0,fret:0}});
    rows.forEach(r=>{const m=r.mes_ref?.split(" ")[0];if(m&&bM[m]){bM[m].fat+=r.valor_usd||0;bM[m].fret+=r.frete_usd||0;bM[m].cnt++;}});
    const tot={fat:rows.reduce((s,r)=>s+(r.valor_usd||0),0),cnt:rows.length,fret:rows.reduce((s,r)=>s+(r.frete_usd||0),0)};
    return {byMes:bM,tot};
  },[recs,prevYrRel]);

  const allYearKeys = useMemo(()=>{
    const s=new Set();
    recs.forEach(r=>{const y=r.mes_ref?.split(" ")[1];if(y)s.add(y);});
    return [...s].sort();
  },[recs]);

  function csv(data,name){if(!data.length)return;const k=Object.keys(data[0]);const c=[k.join(","),...data.map(r=>k.map(x=>JSON.stringify(r[x]??"")||"").join(","))].join("\n");const a=document.createElement("a");a.href="data:text/csv;charset=utf-8,"+encodeURIComponent(c);a.download=name;a.click();}

  function relXLS(rows, mes) {
    const RCOLS = 11;
    const aoa = [
      ["RELATÓRIO MENSAL — "+mes,"","","","","","","","","",""],
      ["","","","","","","","","","",""],
      ["INVOICE","CLIENTE","PO#","NF","DESTINO","VALOR USD","FRETE USD","CONTAINER","ETA","STATUS DOC","STATUS"],
    ];
    rows.forEach((r,i)=>{
      aoa.push([r.invoice||"",r.cliente||"",xlInt(r.po),xlInt(r.nf),r.destino||"",
        xlUSD(r.valor_usd),xlUSD(r.frete_usd),r.container||"",xlDate(r.eta_pedido),r.status_doc||"",r.status||""]);
    });
    const totalUSD = rows.reduce((s,r)=>s+(r.valor_usd||0),0);
    const totRow = aoa.length;
    aoa.push(["","","","","TOTAL USD","$"+totalUSD.toFixed(2),"","","","",""]);
    const cntRow = aoa.length;
    aoa.push(["","","","","Nº CONTAINERS",rows.length,"","","","",""]);
    const ws = XLSX.utils.aoa_to_sheet(aoa);

    /* Styles */
    for(let c=0;c<RCOLS;c++) applyStyle(ws, XLSX.utils.encode_cell({r:0,c}), XS.title);
    for(let c=0;c<RCOLS;c++) applyStyle(ws, XLSX.utils.encode_cell({r:2,c}), XS.header);
    for(let r=3;r<3+rows.length;r++){
      for(let c=0;c<RCOLS;c++) applyStyle(ws, XLSX.utils.encode_cell({r,c}), r%2===1?XS.row0:XS.row1);
    }
    for(let c=0;c<RCOLS;c++){
      applyStyle(ws, XLSX.utils.encode_cell({r:totRow,c}), XS.total);
      applyStyle(ws, XLSX.utils.encode_cell({r:cntRow,c}), XS.totalLbl);
    }
    ws["!merges"]=[{s:{r:0,c:0},e:{r:0,c:RCOLS-1}}];

    ws["!cols"]=[{wch:10},{wch:14},{wch:12},{wch:10},{wch:14},{wch:13},{wch:13},{wch:15},{wch:12},{wch:14},{wch:16}];
    ws["!rows"]=[{hpx:28}];
    ws["!pageSetup"]={orientation:"landscape",paperSize:9,fitToWidth:1,fitToHeight:0,fitToPage:true};
    ws["!printOptions"]={gridLines:false};
    ws["!margins"]={left:0.4,right:0.4,top:0.6,bottom:0.5};
    const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,mes.slice(0,8));
    XLSX.writeFile(wb,`Mensal_${mes.replace(" ","_")}.xlsx`);
  }

  function annualXLS(list, yr) {
    const ACOLS = 6;
    const aoa=[["RELATÓRIO ANUAL — "+yr,"","","","",""],["","","","","",""],
      ["MÊS","CONTAINERS","FATURAMENTO USD","FRETE USD","MÉDIA/CNTR","% FRETE/FAT"]];
    list.forEach(r=>{
      aoa.push([r.m,r.cnt,r.fat,r.fret,r.cnt?r.fat/r.cnt:0,r.fat?(r.fret/r.fat):0]);
    });
    const tot=list.reduce((a,r)=>({fat:a.fat+r.fat,cnt:a.cnt+r.cnt,fret:a.fret+r.fret}),{fat:0,cnt:0,fret:0});
    const totRow = aoa.length;
    aoa.push(["TOTAL",tot.cnt,tot.fat,tot.fret,tot.cnt?tot.fat/tot.cnt:0,tot.fat?tot.fret/tot.fat:0]);
    const ws=XLSX.utils.aoa_to_sheet(aoa);

    /* Styles */
    for(let c=0;c<ACOLS;c++) applyStyle(ws, XLSX.utils.encode_cell({r:0,c}), XS.title);
    for(let c=0;c<ACOLS;c++) applyStyle(ws, XLSX.utils.encode_cell({r:2,c}), XS.header);
    for(let r=3;r<3+list.length;r++){
      for(let c=0;c<ACOLS;c++) applyStyle(ws, XLSX.utils.encode_cell({r,c}), r%2===1?XS.row0:XS.row1);
    }
    for(let c=0;c<ACOLS;c++) applyStyle(ws, XLSX.utils.encode_cell({r:totRow,c}), XS.total);
    ws["!merges"]=[{s:{r:0,c:0},e:{r:0,c:ACOLS-1}}];

    ws["!cols"]=[{wch:14},{wch:12},{wch:16},{wch:14},{wch:14},{wch:14}];
    ws["!rows"]=[{hpx:28}];
    ws["!pageSetup"]={orientation:"portrait",paperSize:9,fitToWidth:1,fitToHeight:0,fitToPage:true};
    ws["!printOptions"]={gridLines:false};
    ws["!margins"]={left:0.6,right:0.6,top:0.6,bottom:0.5};
    const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,yr);
    XLSX.writeFile(wb,`Anual_${yr}.xlsx`);
  }

  const REL_COLS = null; /* unused — kept for reference */

  return <div className="page">
    <div className="ph"><h2>Relatórios</h2><p>Relatórios mensais e anuais com exportação CSV e Excel</p></div>
    <div className="tabs">
      {[["mensal","Mensal"],["anual","Anual"],["geral","Geral"],["pellets","🌲 Pellets"]].map(([id,lb])=>(
        <div key={id} className={`tab${tab===id?" on":""}`} onClick={()=>setTab(id)}>{lb}</div>
      ))}
    </div>

    {tab==="mensal"&&<>
      <div style={{display:"flex",gap:10,marginBottom:16,alignItems:"center",flexWrap:"wrap"}}>
        <select className="sel" value={mes} onChange={e=>setMes(e.target.value)}>{avail.map(m=><option key={m}>{m}</option>)}</select>
        <button className="btn bgx bsm" onClick={()=>relXLS(monthly.rows,mes)}>↓ Excel</button>
        <button className="btn bg2 bsm" onClick={()=>csv(monthly.rows,"relatorio_"+mes.replace(" ","_")+".csv")}>↓ CSV</button>
      </div>
      <div className="kg">
        <div className="kp hi"><div className="kl">Faturamento</div><div className="kv tc" style={{fontSize:20}}>{fmtUSD(monthly.fat)}</div><YoYBadge cur={monthly.fat} prev={monthlyPrev.fat} label={monthlyPrev.label}/></div>
        <div className="kp"><div className="kl">Containers</div><div className="kv">{monthly.cnt}</div><YoYBadge cur={monthly.cnt} prev={monthlyPrev.cnt} label={monthlyPrev.label}/></div>
        <div className="kp"><div className="kl">Frete Total</div><div className="kv" style={{fontSize:20}}>{fmtUSD(monthly.fret)}</div><YoYBadge cur={monthly.fret} prev={monthlyPrev.fret} label={monthlyPrev.label} invert={true}/></div>
        <div className="kp"><div className="kl">Média/CNTR</div><div className="kv gc" style={{fontSize:20}}>{fmtUSD(monthly.cnt?monthly.fat/monthly.cnt:0)}</div></div>
      </div>
      <div className="g2 mb20">
        <div className="card"><div className="ct">Por Cliente</div><Bar data={Object.entries(monthly.bC).sort(([,a],[,b])=>b-a).map(([l,v])=>({l,v}))} fmt={v=>"$"+Math.round(v/1000)+"k"}/></div>
        <div className="card"><div className="ct">Por Destino</div><Donut data={Object.entries(monthly.bD).map(([l,v])=>({l,v}))}/></div>
      </div>
      <div className="card">
        <div className="ct">Detalhamento — {mes}</div>
        <div className="tw"><table>
          <thead><tr><th>Invoice</th><th>Cliente</th><th>PO#</th><th>NF</th><th>Destino</th><th>Valor USD</th><th>Frete USD</th><th>Container</th><th>ETA</th><th>Status Doc</th></tr></thead>
          <tbody>{monthly.rows.map(r=><tr key={r.invoice}>
            <td><strong style={{color:"var(--blue)"}}>{r.invoice}</strong></td><td>{r.cliente}</td><td className="m">{r.po||"—"}</td><td>{r.nf||"—"}</td>

    {tab==="anual"&&<>

        <select className="sel" value={yr} onChange={e=>setYr(e.target.value)}>{allYearKeys.map(a=><option key={a}>{a}</option>)}</select>
        <button className="btn bgx bsm" onClick={()=>annualXLS(annual.list,yr)}>↓ Excel</button>
        <button className="btn bg2 bsm" onClick={()=>csv(annual.list.map(r=>({Mês:r.m,Containers:r.cnt,Faturamento:r.fat.toFixed(2),Frete:r.fret.toFixed(2)})),"anual_"+yr+".csv")}>↓ CSV</button>
      </div>
      <div className="kg">
        <div className="kp hi"><div className="kl">Faturamento {yr}</div><div className="kv tc" style={{fontSize:20}}>{fmtUSD(annual.tot.fat)}</div><YoYBadge cur={annual.tot.fat} prev={annualPrev.tot.fat} label={prevYrRel}/></div>
        <div className="kp"><div className="kl">Containers</div><div className="kv">{annual.tot.cnt}</div><YoYBadge cur={annual.tot.cnt} prev={annualPrev.tot.cnt} label={prevYrRel}/></div>
        <div className="kp"><div className="kl">Frete Total</div><div className="kv" style={{fontSize:20}}>{fmtUSD(annual.tot.fret)}</div><YoYBadge cur={annual.tot.fret} prev={annualPrev.tot.fret} label={prevYrRel} invert={true}/></div>

/* ── RELATÓRIO PELLETS ─── */
function PelletRel({notify}){
  const [rows,setRows]=useState([]);
  const [loading,setLoading]=useState(false);
  const [anos,setAnos]=useState([]);
  const [meses,setMeses]=useState([]);
  const [filtroAno,setFiltroAno]=useState("todos");
  const [filtroMes,setFiltroMes]=useState("todos");

  useEffect(()=>{
    setLoading(true);
    db.from("pellets_exportacoes")
      .select("cliente,valor_eur,peso_ton,mes_ref,status")
      .neq("status","CANCELADO")
      .then(({data,error})=>{
        if(error){notify&&notify("Erro ao carregar pellets","err");setLoading(false);return;}
        const d=data||[];
        setRows(d);
        // Anos disponíveis a partir de mes_ref (formato "MMM YYYY")
        const aSet=new Set();
        const mSet=new Set();
        d.forEach(r=>{
          if(r.mes_ref){
            const parts=r.mes_ref.split(" ");
            if(parts.length===2){aSet.add(parts[1]);mSet.add(r.mes_ref);}
          }
        });
        setAnos(["todos",...[...aSet].sort().reverse()]);
        setMeses(["todos",...[...mSet].sort().reverse()]);
        setLoading(false);
      });
  },[]);

  // Filtrar
  const filtered=useMemo(()=>{
    return rows.filter(r=>{
      if(filtroMes!=="todos") return r.mes_ref===filtroMes;
      if(filtroAno!=="todos"){
        const parts=(r.mes_ref||"").split(" ");
        return parts[1]===filtroAno;
      }
      return true;
    });
  },[rows,filtroAno,filtroMes]);

  // Agregação por cliente
  const porCliente=useMemo(()=>{
    const m={};
    filtered.forEach(r=>{
      const c=r.cliente||"—";
      if(!m[c]) m[c]={cliente:c,fat:0,peso:0,cnt:0};
      m[c].fat  += parseFloat(r.valor_eur)||0;
      m[c].peso += parseFloat(r.peso_ton)||0;
      m[c].cnt  += 1;
    });
    return Object.values(m)
      .map(c=>({...c, pmt: c.peso>0? c.fat/c.peso : null}))
      .sort((a,b)=>b.fat-a.fat);
  },[filtered]);

  // Totais
  const totais=useMemo(()=>({
    fat  : porCliente.reduce((s,c)=>s+c.fat,0),
    peso : porCliente.reduce((s,c)=>s+c.peso,0),
    cnt  : porCliente.reduce((s,c)=>s+c.cnt,0),
    pmt  : (()=>{
      const tf=porCliente.reduce((s,c)=>s+c.fat,0);
      const tp=porCliente.reduce((s,c)=>s+c.peso,0);
      return tp>0?tf/tp:null;
    })(),
  }),[porCliente]);

  const fmtPmt=v=>v!=null?new Intl.NumberFormat("de-DE",{style:"currency",currency:"EUR",minimumFractionDigits:2}).format(v)+"/t":"—";

  if(loading) return <div className="lw"><div className="spin2"/></div>;

  return <div>
    {/* Filtros */}
    <div style={{display:"flex",gap:10,marginBottom:16,alignItems:"center",flexWrap:"wrap"}}>
      <select className="sel" value={filtroAno} onChange={e=>{setFiltroAno(e.target.value);setFiltroMes("todos");}}>
        {anos.map(a=><option key={a} value={a}>{a==="todos"?"Todos os anos":a}</option>)}
      </select>
      <select className="sel" value={filtroMes} onChange={e=>{setFiltroMes(e.target.value);if(e.target.value!=="todos")setFiltroAno("todos");}}>
        {meses.map(m=><option key={m} value={m}>{m==="todos"?"Todos os meses":m}</option>)}
      </select>
      {(filtroAno!=="todos"||filtroMes!=="todos")&&
        <button className="btn bsm bg2" onClick={()=>{setFiltroAno("todos");setFiltroMes("todos");}}>✕ Limpar</button>}
      <span style={{fontSize:12,color:"var(--text2)",marginLeft:4}}>{filtered.length} invoice{filtered.length!==1?"s":""}</span>
    </div>

    {/* Cards totais */}
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(160px,1fr))",gap:12,marginBottom:20}}>
      {[
        {l:"Faturamento Total",v:fmtEUR2(totais.fat),c:"#7C3AED"},
        {l:"Volume Total",v:fmtTon(totais.peso),c:"var(--gold)"},
        {l:"Preço Médio Geral",v:fmtPmt(totais.pmt),c:"var(--blue)"},
        {l:"Invoices",v:totais.cnt,c:"var(--text2)"},
      ].map((k,i)=>(
        <div key={i} className="kp" style={{borderLeft:`3px solid ${k.c}`}}>
          <div className="kl" style={{color:k.c}}>{k.l}</div>
          <div className="kv" style={{fontSize:16,color:k.c}}>{k.v}</div>
        </div>
      ))}
    </div>

    {/* Tabela por cliente */}
    {porCliente.length===0
      ? <div className="empty">Nenhum dado para o período selecionado</div>
      : <div className="card">
          <div className="ct" style={{marginBottom:12}}>Por Cliente</div>
          <div className="tw"><table>
            <thead>
              <tr>
                <th>Cliente</th>
                <th className="r">Invoices</th>
                <th className="r">Volume (ton)</th>
                <th className="r">Faturamento (EUR)</th>
                <th className="r">Part. Faturamento</th>
                <th className="r">Preço Médio (€/t)</th>
              </tr>
            </thead>
            <tbody>
              {porCliente.map((c,i)=>{
                const pctFat=totais.fat>0?c.fat/totais.fat*100:0;
                return <tr key={c.cliente}>
                  <td><strong>{c.cliente}</strong></td>
                  <td className="r" style={{color:"var(--text2)"}}>{c.cnt}</td>
                  <td className="r" style={{fontVariantNumeric:"tabular-nums"}}>{fmtTon(c.peso)}</td>
                  <td className="r" style={{fontVariantNumeric:"tabular-nums",color:"#7C3AED",fontWeight:500}}>{fmtEUR2(c.fat)}</td>
                  <td className="r">
                    <div style={{display:"flex",alignItems:"center",gap:8,justifyContent:"flex-end"}}>
                      <div style={{width:60,height:6,background:"var(--bg3)",borderRadius:3,overflow:"hidden"}}>
                        <div style={{width:pctFat+"%",height:6,background:"#7C3AED",borderRadius:3}}/>
                      </div>
                      <span style={{fontSize:12,fontWeight:600,color:"var(--text2)",minWidth:36,textAlign:"right"}}>{pctFat.toFixed(1)}%</span>
                    </div>
                  </td>
                  <td className="r" style={{fontVariantNumeric:"tabular-nums",fontWeight:600,color:"var(--blue)"}}>{fmtPmt(c.pmt)}</td>
                </tr>;
              })}
            </tbody>
            <tfoot>
              <tr style={{borderTop:"2px solid var(--border)"}}>
                <td><strong>TOTAL</strong></td>
                <td className="r" style={{fontWeight:600}}>{totais.cnt}</td>
                <td className="r" style={{fontWeight:600}}>{fmtTon(totais.peso)}</td>
                <td className="r" style={{fontWeight:700,color:"#7C3AED"}}>{fmtEUR2(totais.fat)}</td>
                <td className="r" style={{fontWeight:600}}>100%</td>
                <td className="r" style={{fontWeight:700,color:"var(--blue)"}}>{fmtPmt(totais.pmt)}</td>
              </tr>
            </tfoot>
          </table></div>

          {/* Barra de participação visual */}
          <div style={{marginTop:16}}>
            <div style={{fontSize:11,fontWeight:600,color:"var(--text2)",marginBottom:8,textTransform:"uppercase",letterSpacing:"0.5px"}}>Participação no volume (ton)</div>
            {porCliente.map(c=>{
              const pctPeso=totais.peso>0?c.peso/totais.peso*100:0;
              return <div key={c.cliente} style={{marginBottom:8}}>
                <div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:3}}>
                  <span style={{fontWeight:500}}>{c.cliente}</span>
                  <span style={{color:"var(--text2)"}}>{fmtTon(c.peso)} <span style={{color:"var(--gold)",fontWeight:600}}>({pctPeso.toFixed(1)}%)</span> · <span style={{color:"var(--blue)"}}>{fmtPmt(c.pmt)}</span></span>
                </div>
                <div style={{height:8,background:"var(--bg3)",borderRadius:4}}>
                  <div style={{height:8,background:"var(--gold)",borderRadius:4,width:pctPeso+"%",transition:"width .4s"}}/>
                </div>
              </div>;
            })}
          </div>
        </div>}
  </div>;
}

/* ── PELLET KPI ─── */
function PellKpi() {
  const [data,setData]=useState({fat:0,cnt:0,alerta:0,loaded:false});
  useEffect(()=>{
    const hoje=new Date().toISOString().slice(0,10);
    Promise.all([
      db.from("pellets_exportacoes").select("valor_eur,status"),
      db.from("pellets_pagamentos").select("dt_prevista,recebido").eq("recebido",false)
    ]).then(([{data:rows},{data:pgts}])=>{
      if(!rows){setData(d=>({...d,loaded:true}));return;}
      const active=rows.filter(r=>r.status&&r.status!=="CANCELADO");
      const venc=(pgts||[]).filter(r=>!r.recebido&&r.dt_prevista&&r.dt_prevista<=hoje).length;
      setData({fat:active.reduce((s,r)=>s+(parseFloat(r.valor_eur)||0),0),cnt:active.length,alerta:venc,loaded:true});
    });
  },[]);
  if(!data.loaded||!data.cnt) return null;
  const fE=v=>new Intl.NumberFormat("de-DE",{style:"currency",currency:"EUR",minimumFractionDigits:2}).format(v);
  return <div className="kp" style={{borderLeft:"3px solid #7C3AED",background:"linear-gradient(135deg,#F5F3FF,#fff)"}}>
    <div className="kl" style={{color:"#7C3AED"}}>🌲 Pellets (EUR)</div>
    <div className="kv" style={{fontSize:18,color:"#7C3AED"}}>{fE(data.fat)}</div>
    <div className="ks">{data.cnt} pedidos ativos{data.alerta>0&&<span style={{marginLeft:6,background:"#DC2626",color:"#fff",borderRadius:10,padding:"1px 7px",fontSize:10,fontWeight:700}}>⚠ {data.alerta}</span>}</div>
  </div>;
}
